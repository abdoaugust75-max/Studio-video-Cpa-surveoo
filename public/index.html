<body>

<!-- ============ TOP: who you are talking to, which project is open, what needs a decision ============
     The old header showed four "apps" side by side plus a server LED and a model LED. That is
     developer telemetry, not the owner's context. What is left is the context and the one or two
     actions that are always relevant; everything else lives behind Advanced. -->
<header>
  <div class="brand" title="Studio"><span class="mark">◆</span>Studio</div>
  <div class="ctx">
    <span class="ctxwho" id="ctxWho">Orchestrator</span>
    <select class="projsel" id="projSel" onchange="selectProject(this.value)" title="Open a project"></select>
    <span class="rolechip" id="roleChip" style="display:none"></span>
  </div>
  <div class="grow"></div>
  <a class="tbtn" href="/pipeline.html" style="text-decoration:none" title="Phone Unboxing Lab production dashboard">Unboxing Lab</a>
  <button class="tbtn" id="mClear" onclick="clearChat()" title="Clear this conversation — projects, videos, scripts, templates and everything Studio learned stay safe">Clear chat</button>
  <button class="tbtn" id="mSet" onclick="openStudioSettings()" title="Models, API keys, quotas, page recipes">Settings</button>
  <span class="conndot" id="ledS" title="connected"></span>
</header>
<div class="advmenu" id="advmenu"></div>

<main id="shell">
  <!-- ============ LEFT: the whole navigation ============
       The seven page profiles are BACKEND RECIPES — they appear in Settings → Page Recipes, never
       here. The rail is the owner's map of the product: one chat, what they keep, configuration. -->
  <aside id="rail">
    <div class="railtop">
      <button class="newtask" onclick="newTask()" title="Start a new instruction in Studio">New chat</button>
    </div>
    <div class="railscroll">
      <div class="railsec">Workspace</div>
      <div class="agents" id="agents"></div>
      <div class="railsec">Library</div>
      <div class="raillib">
        <button class="rlib" onclick="openLibrary()" title="Sources you kept for later — links, not downloads">Saved sources<span class="n" id="libSaved"></span></button>
        <button class="rlib" onclick="openTemplates()" title="Saved editing recipes">Templates</button>
      </div>
    </div>
    <div class="railfoot">
      <button class="rlib" onclick="openStudioSettings()">Settings</button>
    </div>
  </aside>

  <!-- ============ CENTER: adaptive workspace ============ -->
  <section id="work">
    <div class="whead">
      <span class="modechip" id="wMode">idle</span>
      <span class="t" id="wTitle">No project</span>
      <span class="sub" id="wSub"></span>
      <div class="grow"></div>
      <select class="projsel" id="projSel" onchange="selectProject(this.value)" title="Open project"></select>
      <button class="b sm gh" onclick="newProject()" title="New project">＋<span class="lbl"> New</span></button>
      <span class="oc">
        <button class="b sm gh" id="ocOrig" onclick="setView('original')" title="The untouched source">Src</button>
        <button class="b sm" id="ocCur" onclick="setView('current')" title="The current version">Cur</button>
      </span>
      <span class="rolechip" id="roleChip" style="display:none"></span>
      <button class="b sm gh" onclick="openMaster()" title="Master edit and page versions">▤<span class="lbl"> Master</span></button>
      <button class="b sm" id="bPreview" onclick="previewIt()" title="Fast preview of the current cut">▶<span class="lbl"> Preview</span></button>
      <button class="b sm" id="bFinal" onclick="render('final')" title="Final render (production quality)">⬇<span class="lbl"> Final</span></button>
      <button class="b sm gh" onclick="openSearch()" title="Find footage by keyword">🔍<span class="lbl"> Find</span></button>
      <button class="b sm gh" id="bAnalytics" onclick="showAnalytics()" title="Real platform metrics">📈<span class="lbl"> Stats</span></button>
      <button class="b sm gh" onclick="openPalette()" title="Command palette (Ctrl+K)">⌘</button>
    </div>
    <div class="pbar"><i id="pfill" style="right:100%"></i></div>
    <div class="lockbar" id="lockbar"><span class="lbl2">🔒 Locked:</span><div class="locks" id="locks"></div></div>
    <div class="stage" id="stage"></div>
    <!-- The timeline and the drawer belong to an open cut. While a result set is on screen they are
         both irrelevant, so they collapse and the workspace gives its height to the candidates — a
         search result you cannot see properly is a search result you cannot judge. -->
    <div class="tl" id="tlWrap">
      <div class="tltools">
        <span class="tnow" id="tNow">0:00.0</span>
        <span class="hint" id="tInfo">no project</span>
        <span class="hint" id="tSel"></span>
        <div class="grow"></div>
        <button class="b sm gh" onclick="zoom(-1)" title="Zoom out">−</button>
        <button class="b sm gh" onclick="zoom(1)" title="Zoom in">＋</button>
        <button class="b sm gh" onclick="zoom(0)" title="Fit the whole clip">Fit</button>
      </div>
      <div class="tlc" id="tl"></div>
    </div>
    <div class="drawer" id="drawerWrap">
      <div class="dtabs" id="dtabs">
        <button class="dtab on" data-t="transcript" onclick="openTab('transcript')">Transcript</button>
        <button class="dtab" data-t="captions" onclick="openTab('captions')">Captions</button>
        <button class="dtab" data-t="versions" onclick="openTab('versions')">Versions</button>
        <button class="dtab" data-t="artifacts" onclick="openTab('artifacts')">Artifacts</button>
        <button class="dtab" data-t="suggest" onclick="openTab('suggest')">Suggestions <span class="badge" id="sgBadge"></span></button>
        <div class="grow"></div>
        <span class="hint" id="dNote"></span>
        <button class="dcol" id="dCol" onclick="toggleDrawer()" title="Collapse the panel to give the preview more room">▾</button>
      </div>
      <div class="dpanel" id="dpanel"></div>
    </div>
  </section>

  <!-- ============ RIGHT: agent chat ============ -->
  <aside id="chat">
    <div class="chead">
      <span class="dot" id="chatDot"></span>
      <b id="chatName">—</b>
      <span class="sub grow" id="chatSub"></span>
      <span class="dot" id="sseDot" title="live events"></span>
    </div>
    <div class="rtabs" id="rtabs">
      <button class="rtab on" id="rtAgent" onclick="setRight('agent')">Agent</button>
      <button class="rtab" id="rtInsp" onclick="setRight('inspector')">Inspector <span class="badge" id="inspBadge"></span></button>
    </div>
    <div id="agentPane" class="rpane">
    <div class="log" id="log"></div>
    <!-- operational activity: what the agent is doing, expandable to who served each step -->
    <div class="actwrap">
      <div class="actbar" id="actbar" onclick="toggleActivity()" title="What the agent is doing right now">
        <span class="spin2" id="actSpin" style="display:none"></span>
        <span class="t" id="actNow">idle</span>
        <span class="c" id="actCount"></span>
        <span class="cv">▾</span>
      </div>
      <div class="actbody" id="actbody"></div>
    </div>
    <!-- The library opens OVER the thread rather than replacing it: looking something up should not
         cost the conversation, and closing it puts the owner exactly back where they were. -->
    <div class="libpanel" id="libPanel" style="display:none">
      <div class="libhead">
        <b>Saved sources</b>
        <span class="sub grow" id="libNote"></span>
        <button class="b sm gh" onclick="closeLibrary()">Back to Studio</button>
      </div>
      <div class="libscroll" id="libBody"></div>
    </div>
    <div class="composer">
      <div class="pendbar" id="pendbar"></div>
      <div class="cin">
        <button class="plus" id="composerMore" onclick="toggleComposerMenu(event)" title="More ways to start">+</button>
        <textarea id="composer" dir="auto" rows="1" placeholder="Tell Studio what you want…" onkeydown="onKey(event)" oninput="growComposer()"></textarea>
        <button class="b pri" id="sendBtn" onclick="send()">Send</button>
      </div>
      <div class="chint"><span id="cRef"></span><span class="grow"></span><kbd>⌘K</kbd> commands <kbd>Enter</kbd> send</div>
    </div>
    </div>
    <div id="inspector" class="rpane insp" style="display:none"></div>
  </aside>
</main>

<div class="palette" id="palette"><div class="pbox"><input class="pinput" id="pinput" placeholder="Run a command…  (transcribe, captions, trim, music, preview, versions)" oninput="filterPalette()" onkeydown="paletteKey(event)"><div class="plist" id="plist"></div></div></div>

<!-- ============ REVIEW: decide on masters, page versions and paused approvals ============ -->
<section class="view" id="reviewview">
  <div class="vhead">
    <h2>Review</h2>
    <span class="hint" id="rvNote"></span>
    <div class="grow"></div>
    <button class="b sm gh" onclick="syncReview()">⟳ Refresh</button>
  </div>
  <div class="vbody" id="rvBody"></div>
</section>

<!-- ============ PERFORMANCE: real platform metrics, no invented numbers ============ -->
<section class="view" id="perfview">
  <div class="vhead">
    <h2>Performance</h2>
    <span class="hint" id="pfNote"></span>
    <div class="grow"></div>
    <button class="b sm gh" onclick="openPerf()">⟳ Refresh</button>
  </div>
  <div class="vbody" id="pfBody"></div>
</section>

<div id="modals"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ==================================================================================
   Studio frontend. Everything rendered here comes from /api/v2 — no mock data.
   ================================================================================== */
const $ = id => document.getElementById(id);
let PAGES = [], PAGE = null, STATE = null, CATS = null, SEARCH_JOB = null, es = null, POLL = null;
// Destinations the owner ticked in the publish dialog, held between the review step and the post.
let PUB_SEL = null;
// PICKED — the project the editor is currently showing. Cleared on a page switch (a page's own
// pointer is the right default there), set whenever a project is chosen explicitly.
let PICKED = null;

const api = async (u, body) => {
  const r = await fetch(u, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const d = await r.json().catch(() => ({ error: 'bad json (http ' + r.status + ')' }));
  if (!r.ok) throw new Error(d.error || ('http ' + r.status));
  return d;
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n || 0);
const ms = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
const when = t => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function toast(msg, bad) { const el = $('toast'); el.textContent = msg; el.className = 'toast on' + (bad ? ' err' : ''); setTimeout(() => el.className = 'toast', 3600); }

/* ------------------------------------------------ boot */
async function boot() {
  try {
    const d = await api('/api/v2/pages');
    PAGES = d.pages;
    setConn(true);
    paintRail();
    // Restore the exact conversation the owner was using. Background jobs remain visible in the
    // rail, and a reload must never make an active page-agent task look as though it disappeared.
    let remembered = '';
    try { remembered = localStorage.getItem('studio_page') || ''; } catch (_) {}
    const start = PAGES.some(p => p.key === remembered) ? remembered
      : (PAGES.find(p => p.key === 'studio') ? 'studio' : (PAGES[0] || {}).key);
    if (start) await openPage(start);   // openPage applies the chat/editor layout once state is loaded
    loadLibCounts();
    loadLibraryCount();
  } catch (e) { setConn(false, e.message); stage(`<div class="empty"><h2>Server unreachable</h2><p>${esc(e.message)}</p></div>`); }
}
/** The connection light is only shown when something is wrong — a green dot that is always on
 *  teaches the owner nothing and costs a header slot. */
function setConn(ok, why) {
  const el = $('ledS');
  if (!el) return;
  el.className = 'conndot' + (ok ? '' : ' bad');
  el.title = ok ? 'server reachable' : 'server problem: ' + (why || 'unreachable');
}
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(1, Math.round((Date.now() - ts) / 1000));
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
/**
 * paintRail — ONE conversation. The seven page profiles are backend production recipes, not
 * chats (they are visible only in Settings → Page Recipes), so the rail shows exactly one row:
 * the Orchestrator. Any old agent-selector behaviour is gone.
 */
function paintRail() {
  const el = $('agents');
  el.innerHTML = '';
  const orch = PAGES.find(p => p.key === 'studio');
  if (orch) {
    const d = document.createElement('div');
    d.className = 'agent orch on';
    d.dataset.k = 'studio';
    d.style.setProperty('--pc', orch.color);
    const sub = orch.awaiting ? orch.awaiting + ' waiting for you'
      : (orch.running && orch.running.length) ? (orch.running[0].stage || 'working…')
      : orch.messages ? orch.messages + ' messages · ' + ago(orch.updated)
      : 'Say what you want — I will produce the artifacts';
    d.innerHTML =
      `<span class="av"></span>
       <div class="nm"><b>Chat</b><span>${esc(sub)}</span></div>
       <div class="st">${(orch.running && orch.running.length) ? '<span class="spin"></span>' : (orch.awaiting ? `<span class="bdg">${orch.awaiting}</span>` : '')}</div>`;
    d.onclick = () => openPage('studio');
    el.appendChild(d);
  }
  // No profile rows. No agent switcher. Profiles live in Settings → Page Recipes.
}
/** Library counts — how much there is, before the owner clicks into it. */
async function loadLibCounts() {
  try {
    const d = await api('/api/v2/saved');
    const el = $('libSaved');

/**

 * Large playable media, what it is, what changed, then APPROVE / CHANGE / REGENERATE (plus POST for a
 * video). Compare, history, download and the technical record live under ••• so the primary row
 * stays about the decision.
 */
function artifactCard(a) {
  if (!a || (!a.rel && a.kind !== 'script')) return '';
  const st = artStatus(a), cur = isCurrentArt(a);
  const approved = isApprovedArt(a);
  ART_INDEX[a.id] = a;
  const kind = a.kind || 'video';
  const ratio = kind === 'video' && Number(a.width) > 0 && Number(a.height) > 0
    ? Math.max(.3, Math.min(3, Number(a.width) / Number(a.height))).toFixed(4) : '.5625';
  const row = [];
  if (kind === 'video' || kind === 'image') {
    if (!approved) row.push(`<button class="pa" onclick="approveArtifact('${esc(a.id)}')">Approve</button>`);
    row.push(`<button onclick="changeArtifact('${esc(a.id)}')">Change</button>`);
    if (a.project && branchOf(a.project)) row.push(`<button onclick="regenArtifact('${esc(a.id)}')">Regenerate</button>`);
    if (kind === 'video' && approved) {
      if (['source', 'import', 'import_url', 'source_import'].includes(a.op)) {
        row.push(`<button onclick="quickArtifactAction('${esc(a.id)}','Write a script grounded in this footage')">Write script</button>`);
        row.push(`<button onclick="quickArtifactAction('${esc(a.id)}','Add TTS')">Add TTS</button>`);
        row.push(`<button onclick="quickArtifactAction('${esc(a.id)}','Add captions')">Add captions</button>`);
      } else row.push(`<button onclick="quickArtifactAction('${esc(a.id)}','Save this as a template')">Save template</button>`);
      row.push(`<button onclick="publishMany(['${esc(a.id)}'])">Publish…</button>`);
    }
  } else if (kind === 'script') {
    row.push(`<button class="pa" onclick="approveArtifact('${esc(a.id)}')">Approve</button>`);
    row.push(`<button onclick="changeArtifact('${esc(a.id)}')">Rewrite</button>`);
    row.push(`<button onclick="voiceScript('${esc(a.id)}')">Generate voice</button>`);
  } else if (kind === 'description') {
    row.push(`<button class="pa" onclick="approveArtifact('${esc(a.id)}')">Approve</button>`);
    if (navigator.clipboard) row.push(`<button onclick="copyDescription('${esc(a.id)}')">Copy</button>`);
  } else if (kind === 'audio' || kind === 'music') {
    row.push(`<button class="pa" onclick="approveArtifact('${esc(a.id)}')">Approve</button>`);
    row.push(`<button onclick="changeArtifact('${esc(a.id)}')">Regenerate</button>`);
    if (STATE && STATE.project && a.project === STATE.project.id) row.push(`<button onclick="${kind === 'music' ? `applyMusicArtifact('${esc(a.id)}')` : `mixVoice('${esc(a.id)}')`}">Use in video</button>`);
  }
  return `<div class="art" data-artid="${esc(a.id)}" onclick="focusArtifact('${esc(a.id)}')">
    <div class="ahd">
      <div class="atitle"><b>${esc(a.label || OP_WORD[a.op] || a.op || 'Artifact')}</b><span class="asub">${esc(artSub(a))}</span></div>
      ${cur ? '<span class="apill">current</span>' : ''}
      ${st ? `<span class="apill ${st.cls}">${esc(st.label)}</span>` : ''}
      <button class="dots" title="More" onclick="event.stopPropagation();toggleArtMenu(this)">•••</button>
      <div class="artmenu" onclick="event.stopPropagation()">${artMenu(a)}</div>
    </div>
    <div class="amedia media-${esc(kind)}" style="--art-ratio:${ratio}">${artMedia(a)}</div>
    <div class="asum">${esc(artSummary(a))}</div>
    <div class="aprim" onclick="event.stopPropagation()">${row.join('')}<div class="grow"></div></div>
  </div>`;
}
/** Everything that is a real action but not a decision. */
function artMenu(a) {
  const src = a.rel || '';
  const tech = [
    'id ' + a.id, 'op ' + (a.op || '?'), a.project ? 'project ' + a.project : null,
    a.file || null, a.size ? Math.round(a.size / 1024) + ' KB' : null,
    a.ts ? new Date(a.ts).toLocaleString() : null,
  ].filter(Boolean).join('<br>');
  return [
    `<button onclick="showVersionHistory('${esc(a.id)}')">Version history</button>`,
    src ? `<a href="${esc(src)}" download>Download</a>` : '',
    a.kind === 'video' && a.project ? `<button onclick="compareOriginal('${esc(a.id)}')">Compare with the source</button>` : '',
    a.kind === 'video' && a.project ? `<button onclick="rollbackTo('${esc(a.id)}')">Make this the current cut</button>` : '',
    a.kind === 'audio' && STATE && STATE.project && a.project === STATE.project.id ? `<button onclick="mixVoice('${esc(a.id)}')">Add this voice to the video</button>` : '',
    a.kind === 'music' && STATE && STATE.project && a.project === STATE.project.id ? `<button onclick="applyMusicArtifact('${esc(a.id)}')">Use this music in the video</button>` : '',
    '<div class="sep"></div>',
    `<div class="tech">${tech}</div>`,
  ].filter(Boolean).join('');
}
function toggleArtMenu(btn) {
  const m = btn.parentElement.querySelector('.artmenu');
  const open = m && !m.classList.contains('on');
  document.querySelectorAll('.artmenu.on').forEach(x => x.classList.remove('on'));
  if (m && open) m.classList.add('on');
}
/** Is this project one page's creative version (so "Regenerate" is a real operation)? */
function branchOf(projectId) {
  const p = (STATE && STATE.projects || []).find(x => x.id === projectId)
    || (STATE && STATE.project && STATE.project.id === projectId ? STATE.project : null);
  return !!(p && p.role === 'branch');
}

/**
 * artifactSet — several versions from one request, as a SET.
 * Seven full-size players stacked in a conversation is not a comparison; it is a scroll. The set
 * gives each version a compact card with a real preview, and puts the batch decisions (approve /
 * change / post the selected ones) in one row.
 */
function artifactSet(arts) {
  // A batch can contain scripts, audio and videos together. They are all first-class artifacts,
  // but only video/image versions belong in the compact comparison grid. Keeping text/audio in the
  // same video-only renderer made seven ScriptArtifacts appear to vanish from the chat.
  const mediaArts = arts.filter(a => a && (a.kind === 'video' || a.kind === 'image'));
  const sideArts = arts.filter(a => a && a.kind !== 'video' && a.kind !== 'image');
  const sideCards = sideArts.length
    ? `<div class="artifactSideSet"><div class="asethd"><b>Scripts and supporting artifacts</b><span class="asub">${sideArts.length} first-class artifacts</span></div><div class="artifactSideGrid">${sideArts.map(a => artifactCard(a)).join('')}</div></div>`
    : '';
  if (!mediaArts.length) return sideCards;
  arts = mediaArts;
  const ids = arts.map(a => a.id);
  arts.forEach(a => { ART_INDEX[a.id] = a; });
  const selectedIds = ids.filter(id => SEL_ARTS.has(id));
  const sel = selectedIds.length;
  const publishReady = !!sel && selectedIds.every(id => isApprovedArt(ART_INDEX[id]));
  const cards = arts.map(a => {
    const st = artStatus(a);
    const pg = (PAGES || []).find(p => p.key === a.page);
    return `<div class="artv ${SEL_ARTS.has(a.id) ? 'on' : ''}" data-artid="${esc(a.id)}" onclick="focusArtifact('${esc(a.id)}')">
      <div class="vth"><video controls preload="metadata" playsinline src="${esc(a.rel)}#t=0.1" aria-label="Play ${esc(a.label || 'video version')}"></video></div>
      <div class="vm">
        <b>${esc(pg ? pg.label.split('—').pop().trim() : (a.label || a.op))}</b>
        <span>${esc(artSub(a) || 'version')}</span>
        ${st ? `<span class="apill ${st.cls}">${esc(st.label)}</span>` : ''}
      </div>
      <div class="vw" onclick="event.stopPropagation()">
        <button onclick="toggleArtSel(this,'${esc(a.id)}')">${SEL_ARTS.has(a.id) ? '✓ Selected' : 'Select'}</button>
        ${isApprovedArt(a) ? '' : `<button onclick="approveArtifact('${esc(a.id)}')">Approve</button>`}
        <button onclick="changeArtifact('${esc(a.id)}')">Change</button>
      </div>
    </div>`;
  }).join('');
  return `<div class="artset" data-arts="${esc(ids.join(','))}">
    <div class="asethd"><b>${arts.length} versions ready</b><span class="asub">each one is a real render, not a preview image</span><div class="grow"></div>
      <button class="dots" title="Select none" onclick="clearArtSel(this)">•••</button></div>
    <div class="asetgrid">${cards}</div>
    <div class="asetacts">
      <span class="sel">${sel} of ${arts.length} selected</span>
      <button class="pa" ${sel ? '' : 'disabled'} onclick="approveSelected(this)">Approve selected</button>
      <button ${sel ? '' : 'disabled'} onclick="changeSelected(this)">Change selected…</button>
      <button ${publishReady ? '' : 'disabled'} title="Only exact approved versions can be published" onclick="postSelected(this)">Publish selected…</button>
      <div class="grow"></div>
      <button onclick="selectAllArts(this)">Select all</button>
    </div>
  </div>`;
}
function setArtsOf(el) { const s = el.closest('.artset'); return s ? (s.dataset.arts || '').split(',').filter(Boolean) : []; }
function toggleArtSel(btn, id) {
  if (SEL_ARTS.has(id)) SEL_ARTS.delete(id); else SEL_ARTS.add(id);
  btn.textContent = SEL_ARTS.has(id) ? '✓ Selected' : 'Select';
  const card = btn.closest('.artv');
  if (card) card.classList.toggle('on', SEL_ARTS.has(id));
  updateSelCount(btn);
  updateComposerRef();
}
function selectAllArts(btn) { setArtsOf(btn).forEach(id => SEL_ARTS.add(id)); rerenderLogSoft(); }
function clearArtSel(btn) { SEL_ARTS.clear(); rerenderLogSoft(); }
function updateSelCount(el) {
  const set = el.closest('.artset');
  if (!set) return;
  const n = setArtsOf(el).filter(id => SEL_ARTS.has(id)).length;
  const lbl = set.querySelector('.asetacts .sel');
  if (lbl) lbl.textContent = n + ' of ' + setArtsOf(el).length + ' selected';
  set.querySelectorAll('.asetacts button').forEach((b, i) => { if (i < 3) b.disabled = !n; });
}
function rerenderLogSoft() {
  ART_SIG++;
  const log = $('log');
  if (log) log.dataset.sig = '';
  if (STATE) renderLog(STATE.conversation);
}

/* ---- artifact actions: every one is a real backend call ---- */
/**
 * approveArtifact — records the owner's decision against the artifact's OWN project.
 * A page version shown in the orchestrator belongs to its own project, so approving it against the
 * open project would record a decision about the wrong thing.
 */
async function approveArtifact(id) {
  const a = ART_INDEX[id];
  if (!a || !a.project) return toast('This artifact has no project to record a decision against', true);
  try {
    await api('/api/v2/review/decision', { project: a.project, artifact: a.id, state: 'approved', note: 'approved from the workspace' });
    REVIEW_MAP[a.project] = 'approved';
    toast('Approved');
    await refresh();
    rerenderLogSoft();
    refreshReviewBadge();
  } catch (e) { toast(e.message, true); }
}
const CHANGE_ACTIONS = {
  video: ['Change script', 'Change TTS', 'Replace voice', 'Add text', 'Edit text', 'Move text', 'Caption style', 'Add music', 'Remove music', 'Mute original audio', 'Trim', 'Change hook', 'Regenerate', 'Undo'],
  script: ['Change hook', 'Shorten script', 'Rewrite script', 'Change language', 'Generate TTS'],
  audio: ['Generate another TTS', 'Replace voice', 'Change speed', 'Remove TTS', 'Use in video'],
  image: ['Replace image', 'Regenerate'],
};
function chooseArtifactChange(id, label) {
  closeModal();
  const a = ART_INDEX[id];
  FOCUS = a || null;
  SEL_ARTS.clear();
  updateComposerRef();
  focusComposer(label + ': ');
}
function quickArtifactAction(id, prompt) {
  const a = ART_INDEX[id];
  FOCUS = a || null;
  SEL_ARTS.clear();
  updateComposerRef();
  focusComposer(prompt);
}
/** Change surfaces concrete actions while keeping free text available in the composer. */
function changeArtifact(id) {
  const a = ART_INDEX[id];
  FOCUS = a || null;
  SEL_ARTS.clear();
  updateComposerRef();
  const actions = CHANGE_ACTIONS[(a && a.kind) || 'video'] || CHANGE_ACTIONS.video;
  const body = `<div class="jobs">${actions.map(label => `<button class="job" onclick="chooseArtifactChange('${esc(id)}','${esc(label)}')"><b>${esc(label)}</b></button>`).join('')}</div>
    <p class="hint" style="margin-top:12px">Or close this panel and describe any change in your own words. It will target this exact version.</p>`;
  modal('Change ' + esc((a && (a.label || a.op)) || 'artifact'), body, `<button class="b gh" onclick="closeModal();focusComposer('')">Use free-text instruction</button>`);
}
/**
 * approveSelected — one decision per selected version, recorded against each version's OWN project.
 * Deliberately sequential and per-artifact: a batch approval is still N independent decisions, and
 * if one fails the rest must not be reported as approved.
 */
async function approveSelected(el) {
  const ids = setArtsOf(el).filter(id => SEL_ARTS.has(id));
  if (!ids.length) return toast('Select the versions you mean first', true);
  let ok = 0; const failed = [];
  for (const id of ids) {
    const a = ART_INDEX[id];
    if (!a || !a.project) { failed.push(id); continue; }
    try {
      await api('/api/v2/review/decision', { project: a.project, artifact: a.id, state: 'approved', note: 'batch approved from the workspace' });
      REVIEW_MAP[a.project] = 'approved';
      ok++;
    } catch (e) { failed.push((a.label || id) + ': ' + e.message); }
  }
  toast(ok + ' approved' + (failed.length ? ', ' + failed.length + ' failed — ' + failed[0] : ''), failed.length > 0);
  rerenderLogSoft();
  refreshReviewBadge();
}
async function changeSelected(el) {
  const ids = setArtsOf(el).filter(id => SEL_ARTS.has(id));
  if (!ids.length) return toast('Select the versions you mean first', true);
  FOCUS = null;
  focusComposer('Change these ' + ids.length + ' versions: ');
  toast(ids.length + ' versions selected — describe the change');
}
async function postSelected(el) {
  const ids = setArtsOf(el).filter(id => SEL_ARTS.has(id));
  await publishMany(ids);
}
function updateComposerRef() {
  const el = $('cRef');
  if (!el) return;
  const n = SEL_ARTS.size;
  el.textContent = n ? n + ' version' + (n > 1 ? 's' : '') + ' selected — your message applies to them'
    : FOCUS ? 'applies to: ' + (FOCUS.label || FOCUS.op || FOCUS.id) : '';
}
/** Regenerate — a real re-run of that page version, not a fresh guess at the whole thing. */
async function regenArtifact(id) {
  const a = ART_INDEX[id];
  if (!a || !a.project) return toast('Only page versions can be regenerated', true);
  try {
    const d = await api('/api/v2/branch/regenerate', { branch: a.project, target: 'all' });
    if (d && d.error) return toast(d.error, true);
    toast('Regenerating this version…');
    if (d && d.jobId) waitJob(d.jobId);
    else await refresh();
  } catch (e) { toast(e.message, true); }
}
/** Generate the voice for a script artifact — the real TTS path, on the script's own text. */
async function voiceScript(id) {
  const a = ART_INDEX[id];
  if (!a || !a.project) return toast('This script has no project yet', true);
  const page = a.page || (PAGE && PAGE.key);
  try {
    const d = await api('/api/v2/tts', { page, project: a.project, text: a.text || '', voice: '', scriptId: a.op === 'script' ? a.id : null });
    toast('Generating the voiceover…');
    await waitJob(d.jobId);
  } catch (e) { toast(e.message, true); }
}
function copyDescription(id) {
  const a = ART_INDEX[id];
  if (!a) return;
  navigator.clipboard.writeText(a.text || '').then(() => toast('Description copied')).catch(() => toast('Could not copy', true));
}
async function showVersionHistory(id) {
  const a = ART_INDEX[id];
  if (!a || !a.project) return toast('No version history is available', true);
  try {
    const d = await api('/api/v2/project?id=' + encodeURIComponent(a.project));
    const arts = d.artifacts || [];
    const rows = arts.slice().reverse().map(v => `<div class="job" style="align-items:flex-start"><span style="flex:1"><b>${esc(v.label || v.op || v.id)}</b><span class="hint">${esc(artSub(v))}${v.id === d.project.current ? ' · current' : ''}${v.id === d.project.approvedArtifact ? ' · approved' : ''}</span></span><button class="b sm" onclick="closeModal();rollbackToProject('${esc(a.project)}','${esc(v.id)}')">Use</button></div>`).join('');
    modal('Version history', rows || '<p class="hint">No versions yet.</p>', '<button class="b gh" onclick="closeModal()">Back to Studio</button>');
  } catch (e) { toast(e.message, true); }
}
async function compareOriginal(id) {
  const a = ART_INDEX[id];
  if (!a || !a.project) return toast('No source is available', true);
  try {
    const d = await api('/api/v2/project?id=' + encodeURIComponent(a.project));
    const source = (d.artifacts || []).find(x => x.id === d.project.sourceArtifact) || (d.artifacts || [])[0];
    if (!source || !source.rel) return toast('The source artifact is unavailable', true);
    modal('Compare with source', `<div class="compare"><div><b>Source</b>${artMedia(source)}</div><div><b>Current version</b>${artMedia(a)}</div></div>`, '<button class="b gh" onclick="closeModal()">Back to Studio</button>');
  } catch (e) { toast(e.message, true); }
}
async function rollbackToProject(project, artifact) {
  try { await api('/api/v2/artifacts/rollback', { project, artifact }); closeModal(); toast('Now using that version'); await refresh(); }
  catch (e) { toast(e.message, true); }
}
/**
 * focusArtifact — the artifact the owner is looking at.
 * Sent with every message, so "make the title shorter" means THIS clip instead of whatever is newest.
 */
async function rollbackTo(id) {
  try { await api('/api/v2/artifacts/rollback', { project: STATE.project.id, artifact: id }); toast('Now using that version'); await refresh(); }
  catch (e) { toast(e.message, true); }
}
/**
 * The checkpoint card. Only the checkpoint that is CURRENTLY pending is actionable — an earlier
 * card whose decision was already taken (or that was superseded by a newer pause) collapses to a
 * neutral note, so the log can never offer a button for a decision the backend already holds.
 */
function approvalCard(ap) {
  const live = !!(STATE && STATE.project && STATE.project.pending && STATE.project.pending.status === 'waiting'
    && STATE.project.id === ap.project
    && (!STATE.project.pending.artifact || STATE.project.pending.artifact === ap.artifact));
  const n = ap.total ? ` (step ${ap.cursor}/${ap.total})` : '';
  if (!live) {
    return `<div class="appr done"><div class="t">⏸ Checkpoint${n} — already decided or superseded</div>
      <div class="s">${esc(ap.op || 'change')} · see the approval history for the decision</div></div>`;
  }
  return `<div class="appr" data-approval="${esc(ap.project)}">
    <div class="t">⏸ Needs your review${n}</div>
    <div class="s">${esc(ap.op || 'change')}${ap.checkpoint ? ' · ' + esc(ap.checkpoint) : ''}<br>Nothing continues until you decide.</div>
    <div class="r">
      <button class="pri" onclick="approvalDecision('approve')">✅ Approve</button>
      <button onclick="approvalDecision('regenerate')">🔁 Regenerate</button>
      <button onclick="approvalDecision('reject')">❌ Reject</button>
      <button onclick="approvalFix()">✏️ Change…</button>
    </div></div>`;
}
async function rollbackTo(id) {
  try { await api('/api/v2/artifacts/rollback', { project: STATE.project.id, artifact: id }); toast('Restored that version'); await refresh(); }
  catch (e) { toast(e.message, true); }
}
/** Sticky banner so a pending checkpoint is impossible to miss, even mid-scroll. */
function renderPending() {
  const el = $('pendbar');
  const p = STATE && STATE.project && STATE.project.pending;
  if (!p || p.status !== 'waiting') { el.className = 'pendbar'; el.innerHTML = ''; return; }
  const n = p.total ? ` (${p.cursor}/${p.total})` : '';
  el.className = 'pendbar on';
  el.innerHTML = `<span>⏸</span><span class="t">${esc(p.label || p.op)}${n} is waiting for you</span>
    <button class="pri" onclick="approvalDecision('approve')">Approve</button>
    <button onclick="approvalDecision('reject')">Reject</button>`;
}
async function approvalDecision(decision, note) {
  const p = STATE && STATE.project && STATE.project.pending;
  if (!p) return toast('nothing is waiting for approval', true);
  try {
    const d = await api('/api/v2/approval/decision', { project: STATE.project.id, decision, note: note || '' });
    toast(decision === 'approve' ? 'Approved — continuing' : decision === 'reject' ? 'Rejected — rolled back' : decision === 'regenerate' ? 'Re-running that step' : 'Change requested');
    await refresh();
    if (d.resumed) waitJob(d.resumed.id);
  } catch (e) { toast(e.message, true); await refresh(); }
}
function approvalFix() {
  const t = $('composer');
  t.value = 'Instead of that, ';
  t.focus();
  t.setSelectionRange(t.value.length, t.value.length);
  toast('Describe the change, then Send — the agent keeps the approved versions');
}
/**
 * candCard — a real search candidate: playable, with the measured facts and the reason it matched.
 * Nothing here is invented; every field came from the search that produced the card. `compact` is the
 * in-chat version (cover only) so a chat column does not stream six videos at once.
 */
/* Human words for measured signals. The raw booleans and the ranking formula were on the card by
   default, which made a search result read like a debug dump. */
function candSignals(c) {
  const s = (c && c.signals) || {};
  // Say WHY there are no checks rather than a bare "not checked": the owner asked for no faces, so
  // "nobody looked" and "we looked and could not tell" are different facts.
  if (s.source !== 'vision') {
    // Every candidate should carry real vision signals now; if one does not, say honestly that it
    // was NOT verified instead of a soft "wasn't requested" that reads like a pass.
    const why = String(s.reason || '');
    if (/^not checked/i.test(why)) return '<span class="no">Not visually verified — treat with caution</span>';
    return '<span class="unk">Visual check could not run' + (why ? ': ' + esc(why) : '') + '</span>';
  }
  const it = [];
  it.push(s.faces === false ? '<span class="yes">No face detected</span>'
    : s.faces === true ? '<span class="no">Person on screen</span>' : '<span class="unk">Face check inconclusive</span>');
  it.push(s.textOverlay === false ? '<span class="yes">Minimal text</span>'
    : s.textOverlay === true ? '<span class="no">Text already on it</span>' : '<span class="unk">Text check inconclusive</span>');
  if (s.productVisible === true) it.push('<span class="yes">Product clearly visible</span>');
  if (s.realFootage === true) it.push('<span class="yes">Real footage</span>');
  else if (s.realFootage === false) it.push('<span class="no">Looks like a still image</span>');
  return it.join('<i>·</i>');
}
/**
 * candCard — a real search result, presented as something the owner can judge in a second:
 * playable preview, title, what it is, and the human meaning of the checks that were run.
 * The match score, measured dimensions and the ranking reasons are under Details.
 */
function candCard(c, compact) {
  const m = c.measured || {};
  // Everything the owner needs to JUDGE: what it looks like, what it is, how long, where from, and
  // whether it has the properties they asked for. Dimensions, match score and the ranking reasons
  // are evidence, so they go under Details where they can be checked without crowding the choice.
  const facts = [];
  if (m.width) facts.push(m.width + '×' + m.height + (m.orientation ? ' ' + m.orientation : ''));
  if (c.duration) facts.push('duration ' + Math.round(c.duration) + 's (' + (c.durationSource === 'measured' ? 'measured' : 'from source metadata') + ')');
  if (c.plays) facts.push(fmt(c.plays) + ' plays on the source');
  if (c.likes) facts.push(fmt(c.likes) + ' likes on the source');
  facts.push('match ' + Math.round((c.score || 0) * 100) + '%');
  const why = (c.why || []).filter(w => !/^title carries/.test(w));
  const host = c.source ? String(c.source).replace(/^https?:\/\//, '').split('/')[0] : '';
  // Chat cards are persisted and rendered after the ephemeral search grid is gone, so they

  const th = (!c.preview || compact)
    ? `<div class="cth"><div class="ph" style="background-image:url('${esc(c.cover || '')}')"></div>${c.duration ? `<span class="du">${ms(c.duration)}</span>` : ''}</div>`
    : `<div class="cth"><video controls preload="metadata" playsinline src="${esc(c.preview)}"></video>${c.duration ? `<span class="du">${ms(c.duration)}</span>` : ''}</div>`;
  return `<div class="cand" data-cid="${esc(c.id)}">

        <details class="cdet"><summary>Details</summary><div>${esc(facts.join('\n'))}${why.length ? '\nwhy it matched: ' + esc(why.join(' · ')) : ''}</div></details>

}
/**
 * markDeadPreviews — a candidate whose stream refuses to load is FLAGGED, not left as a silent black
 * player that looks like a broken app. Platform CDN links expire, and some (signed "webapp prime"
 * URLs) cannot be refreshed at all, so this is a normal state that has to be said out loud. The
 * player is dropped because controls that cannot play anything are worse than a still frame.
 */
function markDeadPreviews(root) {
  (root || document).querySelectorAll('.cand video,.art video,.artv video').forEach(v => {
    if (v.dataset.watched) return;
    v.dataset.watched = '1';
    const dead = () => {
      if (v.dataset.ok) return;
      const card = v.closest('.cand,.art,.artv');
      v.remove();
      if (!card) return;
      if (card.classList.contains('art')) {
        const media = card.querySelector('.amedia');
        if (media) {
          media.classList.add('unavailable');
          media.innerHTML = '<div><b>Preview unavailable</b><span>This older version cannot be played from this computer. It is kept in the project history; create a new preview from the current version to continue.</span></div>';
        }
        // A dead preview is not a decision-ready artifact.  Do not leave Approve / Change actions
        // below it — they promise an edit against bytes that are no longer present locally.
        const actions = card.querySelector('.aprim');
        const id = card.dataset.artid || '';
        if (actions && id) actions.innerHTML = `<button onclick="showVersionHistory('${esc(id)}')">View history</button><div class="grow"></div>`;
        return;
      }
      if (card.classList.contains('artv')) {
        card.classList.add('unavailable');
        const frame = card.querySelector('.vth');
        if (frame) frame.innerHTML = '<div><b>Preview unavailable</b>This version is kept in history, but its media file is not on this computer.</div>';
        const actions = card.querySelector('.vw');
        const id = card.dataset.artid || '';
        if (actions && id) actions.innerHTML = `<button onclick="showVersionHistory('${esc(id)}')">View history</button>`;
        return;
      }
      card.classList.add('deadpreview');
      const st = card.querySelector('.cst');
      if (st) { st.textContent = 'preview would not load — the platform link for this clip has expired. Importing it may still work; try that, or pick another.'; st.className = 'cst err'; }
    };
    v.addEventListener('loadedmetadata', () => { v.dataset.ok = '1'; }, { once: true });
    v.addEventListener('error', dead, { once: true });
    setTimeout(() => { if (!v.dataset.ok && v.readyState === 0) dead(); }, 12000);
  });
}
function wireCandidates(root, compact) {
  (root || document).querySelectorAll('[data-use]').forEach(b => b.onclick = () => useCandidate(b.dataset.use));
  markDeadPreviews(root);
  (root || document).querySelectorAll('[data-save]').forEach(b => b.onclick = () => saveCandidate(b.dataset.save, b));
  (root || document).querySelectorAll('[data-forget]').forEach(b => b.onclick = () => forgetSource(b.dataset.forget, b));
  (root || document).querySelectorAll('[data-more]').forEach(b => b.onclick = () => {
    const c = (CATS || []).find(x => String(x.id) === b.dataset.more);
    const q = String(b.dataset.moreQuery || (c && c.title ? String(c.title).replace(/#\S+/g, '').trim() : '') || '').trim();
    if (!q) return toast('This source has no usable search description', true);
    // In the normal chat workspace, More like this is another owner request. The old path
    // switched into an obsolete create surface and passed only an opaque candidate ID, which
    // made the button look dead or return no results.
    if (UI === 'chat') {
      const composer = $('composer');
      if (!composer) return;
      composer.value = 'Find me 5 more source videos similar to: ' + q;
      send();
      return;
    }
    searchNow(q);

}
/**
 * useCandidate — import by candidate id.
 * The server looks the candidate up in its own last search, so the stream URL that gets imported is
 * the one that was discovered and measured, not one the page supplied.
 */
async function useCandidate(candidateId) {
  const card = document.querySelector(`.cand[data-cid="${candidateId}"]`);
  const st = document.querySelector(`[data-st="${candidateId}"]`);
  const say = (t, bad) => { if (st) { st.textContent = t; st.className = 'cst' + (bad ? ' err' : ''); } };
  if (card) card.classList.add('importing');
  say('importing…');
  try {
    const d = await api('/api/v2/source/import', { page: PAGE.key, project: STATE.project ? STATE.project.id : '', candidate: candidateId });
    // Real stage text from the job, so "Importing… Validating… Ready" describes actual work.
    for (let i = 0; i < 90; i++) {
      await new Promise(r => setTimeout(r, 2000));
      let j; try { j = await api('/api/v2/job?id=' + d.jobId); } catch (_) { break; }
      if (j.stage) say(j.stage + (j.pct ? ' (' + j.pct + '%)' : ''));
      if (j.status === 'done') {
        say('ready — source imported');
        if (card) { card.classList.remove('importing'); card.classList.add('imported'); }
        toast('Imported. Opening the project…');
        await refresh();
        if (d.project) { /* the import created or reused the project; refresh() follows the pointer */ }
        loadEditor(true);
        return j;
      }
      if (j.status === 'failed') {
        const msg = j.error || 'import failed';
        say(msg, true);
        if (card) card.classList.remove('importing');
        toast(msg, true);
        return j;
      }
    }
    say('still working — check the Activity panel', true);
  } catch (e) {
    say(e.message, true); if (card) card.classList.remove('importing'); toast(e.message, true);
  }
}
async function waitJob(id) {

    await new Promise(r => setTimeout(r, 2500));
    let j; try { j = await api('/api/v2/job?id=' + id); } catch (_) { return null; }
    if (j.status === 'done' || j.status === 'failed') {
      if (j.status === 'failed') toast('Failed: ' + j.error, true);
      await refresh(); return j;
    }
  }
  return null;
}

/**
 * publishMany — posting one or several versions.

 * The destination list is built from the versions' OWN pages, and the backend then authorises every
 * artifact → destination pair again. A pair that is not allowed is refused per-pair with its reason,
 * so a version can never be posted to another brand's page — the UI is a convenience, the check is
 * in the backend. Nothing is posted until the owner confirms the exact list they were shown.

async function publishMany(ids) {
  ids = (ids || []).filter(Boolean);
  if (!ids.length) return toast('Select at least one version to post', true);
  const arts = ids.map(id => ART_INDEX[id]).filter(Boolean);
  const pages = [...new Set(arts.map(a => a.page).filter(Boolean))];
  if (!pages.length) return toast('These artifacts have no page to post from', true);
  modal('Post versions', '<div class="pub"><span class="hint">Checking which pages may post…</span></div>');
  const dests = [];
  for (const pg of pages) {
    try {
      const d = await api('/api/v2/destinations?page=' + encodeURIComponent(pg));
      for (const x of (d.destinations || []).filter(y => y.postable)) {
        if (!dests.find(y => y.id === x.id)) dests.push({ ...x, page: pg });
      }
    } catch (_) {}
  }
  if (!dests.length) {
    return modal('Post versions', `<div class="pub"><span class="hint">No authorised destination yet for ${esc(pages.join(', '))}. Add one in Settings → Page agents first.</span></div>`,
      '<button class="b sm gh" onclick="closeModal()">Back to Studio</button>');
  }
  modal('Post versions', `<div class="pub">
    <div><b style="font-size:12.5px">${ids.length} version(s)</b> <span class="hint">from ${esc(pages.join(', '))}</span></div>
    <div class="opts">${dests.map(d => `<label class="opt"><input type="checkbox" data-dest="${esc(d.id)}" checked>
      <span class="nm">${esc(d.name)}</span><span class="hint">${esc(d.page)}</span></label>`).join('')}</div>
    <div id="pubPreview" class="pub"></div></div>`,
    `<button class="b sm gh" onclick="closeModal()">Cancel</button>
     <button class="b sm pri" onclick="publishManyPlan('${esc(ids.join(','))}')">Review &amp; post</button>`);

/** Step two: the dry run. Every pair is authorised by the backend before anything is shown as postable. */

async function retryFailedPairs(pairs) {
  const artifacts = [...new Set((pairs || []).map(x => x.artifact).filter(Boolean))];
  const destinations = [...new Set((pairs || []).map(x => x.destination).filter(Boolean))];
  try {
    const p = await api('/api/v2/publish/plan', { artifacts, destinations });
    const r = await api('/api/v2/publish/retry-failed', { artifacts, destinations, token: p.token, confirm: true });
    modal('Retry results', `<div class="pub"><div class="pair"><span class="t">${esc(String(r.posted || 0))} destination(s) posted</span><span class="d">${r.failed ? esc(String(r.failed)) + ' still failed' : 'retry complete'}</span></div></div>`, '<button class="b sm gh" onclick="closeModal()">Back to Studio</button>');
    await refresh();
  } catch (e) { toast(e.message, true); }
}

/* ------------------------------------------------ source search */
/**
 * searchNow — find REAL footage for a request.
 * The header publishes what the discovery layer understood and what it could not check, so a poor
 * result set can be argued with instead of being a black box.
 */
async function searchNow(q) {
  q = String(q || '').trim();
  if (!q) return;
  CATS = null;
  stageTransient('searching', `<div class="empty" style="margin:auto"><h2>Searching for “${esc(q)}”…</h2>
    <p>Real results only — each candidate is measured, and the shortlist is ranked. This takes about a minute.</p></div>`);
  try {
    const d = await api('/api/v2/source/search', { page: PAGE.key, project: STATE.project ? STATE.project.id : '', query: q, limit: 5 });
    SEARCH_JOB = d.jobId;
    const j = await waitJob(d.jobId);
    if (!j || j.status === 'failed') throw new Error((j && j.error) || 'search failed');
    const r = (j.result || {});
    const cands = r.candidates || [];
    CATS = cands;
    if (!cands.length) {
      return stageTransient('search results', `<div class="empty" style="margin:auto"><h2>No usable candidates</h2>
        <p>${esc(r.notes ? r.notes.join(' ') : 'The source engine returned nothing for that request.')}</p></div>`);
    }
    const intent = r.intent || {};
    const tags = Object.keys(intent.matched || {});
    // The headline is the answer; the counts, the matched terms and the ranking reasons are evidence,
    // so they sit under one disclosure instead of being the first thing the owner has to parse.
    const notes = r.notes || [];
    const visionNote = notes.find(n => /Faces\/text/i.test(n)) || '';
    const otherNotes = notes.filter(n => n !== visionNote);
    const tech = [
      intent.subject ? 'subject: ' + intent.subject : '',
      tags.length ? 'matched terms: ' + tags.join(', ') : '',
      r.considered ? 'considered: ' + r.considered : '',
      ...otherNotes,
    ].filter(Boolean);
    stageTransient('search results', `<div class="shead">
      <div class="row">
        <b class="sheadh">${cands.length} result${cands.length === 1 ? '' : 's'} for “${esc(r.query || '')}”</b>
        <div class="grow"></div>
        <button class="b sm gh" onclick="clearTransient();renderWorkspace()" title="Back to the project view">◀ Back to project</button>
      </div>
      <div class="note">Ranked to prefer clean, product-focused footage. ${esc(visionNote)}</div>
      <details class="cdet"><summary>How these were chosen</summary><div>${esc(tech.join('\n'))}</div></details>
    </div>
    <div class="sgrid">${cands.map(c => candCard(c, false)).join('')}</div>`, root => wireCandidates(root, false));
  } catch (e) {
    stageTransient('search failed', `<div class="empty" style="margin:auto"><h2>Search failed</h2><p>${esc(e.message)}</p></div>`);
    toast(e.message, true);
  }
}
/* ------------------------------------------------ the saved source library */
/**
 * savedCard — a source the owner kept. Everything shown came off the stored record, and the
 * availability line is the honest part: nothing here has been fetched since it was saved unless some
 * real import did it, so "may have expired" is stated rather than implied away.
 */
function savedCard(r) {
  const av = r.availability || {};
  const line = [r.author ? '@' + esc(r.author) : '', r.platform ? esc(r.platform) : '', r.duration ? ms(r.duration) : ''].filter(Boolean).join('<i>·</i>');
  const state = av.state === 'ok'
    ? '<span class="yes">Fetched before — it worked</span>'
    : av.state === 'gone' ? '<span class="no">' + esc(av.note || 'The platform refused it') + '</span>'
      : '<span class="unk">Not fetched since it was saved — the link may have expired</span>';
  const meta = [state, r.collection ? esc(r.collection) : '', (r.tags || []).length ? esc((r.tags || []).join(', ')) : ''].filter(Boolean).join('<i>·</i>');
  const th = r.cover
    ? `<div class="cth"><div class="ph" style="background-image:url('${esc(r.cover)}')"></div>${r.duration ? `<span class="du">${ms(r.duration)}</span>` : ''}</div>`
    : '<div class="cth empty"><span>Saved source link</span></div>';
  return `<div class="cand" data-sid="${esc(r.id)}">
    ${th}
    <div class="cinf">
      <b dir="auto">${esc(r.title || '(untitled)')}</b>
      <div class="cln">${line || 'source unknown'}</div>
      <div class="csig">${meta}</div>
      <div class="cact">
        <button class="imp" data-imp-saved="${esc(r.id)}">Import</button>
        <button data-forget="${esc(r.id)}" title="Remove it from the library — projects keep what they already imported">Remove</button>
        <details class="cdet"><summary>Details</summary><div>${esc('saved ' + new Date(r.savedAt).toLocaleString() + '\n' + r.url + (r.note ? '\nnote: ' + r.note : ''))}</div></details>
      </div>
      <div class="cst" data-sst="${esc(r.id)}"></div>
    </div></div>`;
}

async function openLibrary(q) {
  const panel = $('libPanel');
  if (!panel) return;
  panel.style.display = 'flex';
  const body = $('libBody');
  body.innerHTML = '<div class="empty" style="margin:auto"><p>Loading your saved sources…</p></div>';
  try {
    const d = await api('/api/v2/saved' + (q ? '?q=' + encodeURIComponent(q) : ''));
    $('libNote').textContent = d.total ? d.total + ' kept · links, not downloads' : '';
    if (!d.total) {
      body.innerHTML = '<div class="empty" style="margin:auto"><h2>Nothing saved yet</h2><p>When a search turns up something worth keeping, use <b>Save</b> on the candidate. Only the link and what the search measured are stored — the video is not downloaded, so a saved source is a bookmark you can import later rather than a file you own.</p></div>';
      return;
    }
    body.innerHTML = d.items.map(savedCard).join('');
    wireCandidates(body);
    body.querySelectorAll('[data-imp-saved]').forEach(b => b.onclick = () => importSaved(b.dataset.impSaved, b));
  } catch (e) {
    body.innerHTML = `<div class="empty" style="margin:auto"><h2>Library unavailable</h2><p>${esc(e.message)}</p></div>`;
  }
}
function closeLibrary() { const p = $('libPanel'); if (p) p.style.display = 'none'; }
async function loadLibraryCount() {
  try { const d = await api('/api/v2/saved?limit=1'); const n = $('libSaved'); if (n) n.textContent = d.total ? String(d.total) : ''; } catch (_) {}
}
/** saveCandidate — keep a source for later. Nothing is downloaded, and the status line says so. */
async function saveCandidate(candidateId, btn) {
  const st = document.querySelector(`[data-st="${candidateId}"]`);
  const say = (t, bad) => { if (st) { st.textContent = t; st.className = 'cst' + (bad ? ' err' : ''); } };
  if (btn && btn.disabled) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
  say('saving the link…');
  try {
    const d = await api('/api/v2/source/save', { candidate: candidateId, page: PAGE ? PAGE.key : '' });
    say(d.created ? 'saved — only the link was kept, not the video' : 'already in your library — its details were refreshed');
    if (btn) btn.textContent = 'Saved';
    toast(d.created ? 'Saved under Library → Saved sources' : 'Already saved — details refreshed');
    loadLibraryCount();
  } catch (e) {
    say(e.message, true);
    if (btn) { btn.disabled = false; btn.textContent = 'Save'; }
  }
}
async function forgetSource(id, btn) {
  if (btn) btn.disabled = true;
  try {
    await api('/api/v2/saved/forget', { id });
    const card = document.querySelector(`.cand[data-sid="${id}"]`);
    if (card) card.remove();
    const body = $('libBody');
    if (body && !body.querySelector('.cand')) openLibrary();
    toast('Removed from the library — projects keep anything already imported');
    loadLibraryCount();
  } catch (e) { toast(e.message, true); if (btn) btn.disabled = false; }
}
/** importSaved — same import job as a fresh candidate, so there is ONE way into a project. */
async function importSaved(id, btn) {
  const st = document.querySelector(`[data-sst="${id}"]`);
  const say = (t, bad) => { if (st) { st.textContent = t; st.className = 'cst' + (bad ? ' err' : ''); } };
  if (btn) btn.disabled = true;
  say('importing…');
  try {
    const d = await api('/api/v2/saved/import', { id, page: PAGE ? PAGE.key : '', project: STATE && STATE.project ? STATE.project.id : '' });
    for (let i = 0; i < 90; i++) {
      await new Promise(r => setTimeout(r, 2000));
      let j; try { j = await api('/api/v2/job?id=' + d.jobId); } catch (_) { break; }
      if (j.stage) say(j.stage + (j.pct ? ' (' + j.pct + '%)' : ''));
      if (j.status === 'done') { say('ready — imported'); closeLibrary(); toast('Imported. The source is in the conversation.'); await refresh(); loadLibraryCount(); return j; }
      if (j.status === 'failed') { say(j.error || 'import failed', true); if (btn) btn.disabled = false; return j; }
    }
    say('still working — check Activity', true);
  } catch (e) { say(e.message, true); if (btn) btn.disabled = false; }
}
function openSearch() {
  const q = prompt('Describe the footage you want — e.g. "clean iPhone unboxing, no faces, no text":', '');
  if (!q) return;
  // In chat the request becomes a message, so the search runs through the SAME agent path as typing
  // it, the result is persisted, and the candidates arrive as artifacts in the conversation.
  if (UI === 'chat') { $('composer').value = 'Find source footage for me: ' + q; send(); return; }
  searchNow(q);
}

/* ------------------------------------------------ composer */
function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }
/** The composer grows with the instruction. Capped, so a pasted essay cannot eat the transcript. */
function growComposer() {
  const t = $('composer');
  if (!t) return;
  t.style.height = 'auto';
  t.style.height = Math.min(Math.max(t.scrollHeight, 44), 180) + 'px';
}
async function send() {
  const t = $('composer');
  const v = t.value.trim();
  if (!v) return;
  t.value = '';
  growComposer();
  closeMenus();
  // The turn itself is the new task: the starting panel goes away with the first instruction.
  NEWTASK = false;
  const refs = selectionRefs();
  try {
    const d = await api('/api/v2/agent/message', {
      page: PAGE.key, project: STATE.project ? STATE.project.id : '', message: v,
      focus: FOCUS ? FOCUS.id : '', refs,
    });
    SEL_ARTS.clear();
    updateComposerRef();
    markBusy(true); progress(3, 'agent received');
    await refresh();
    waitJob(d.jobId);
  } catch (e) { toast(e.message, true); }
}
/**
 * selectionRefs — what this turn is ABOUT, using stable artifact ids.
 * A focused artifact or an explicit multi-selection is sent as `refs`, so "lower the music in these"
 * does not depend on the model guessing which videos the owner meant.
 */
function selectionRefs() {
  const refs = [...SEL_ARTS];
  if (!refs.length && FOCUS && FOCUS.id) refs.push(FOCUS.id);
  return refs;
}
function quick(text) { $('composer').value = text; send(); }

  reply_deep: 'Orchestrator — complex reasoning',
  plan_simple: 'Editor — mechanical operations',
  plan: 'Editor — edit planning',

function tabBackend() {
  const tasks = Object.keys(SETTINGS.routing.tasks || {});
  const all = SETTINGS.models || [];
  return `
  <div class="fld"><label>Task map — every backend role and the ordered chain it will try</label>
    <div class="hint">Each role walks its chain until one model answers. Quota-limited and unavailable models are skipped automatically. The usage policy (Advanced) reorders chains to protect scarce models.</div></div>
  ${tasks.map(t => {
    const chain = (SETTINGS.routing.tasks[t] || []);
    const meta = id => { const m = all.find(x => x.id === id); return m || null; };
    const hp = h => h === 'ready' ? 'ready' : h === 'rate_limited' ? 'rate_limited' : h === 'error' ? 'error' : 'unknown';
    return `<div class="fld taskcard">
      <div class="srow" style="margin-bottom:4px"><div class="k"><b>${esc(TASK_VIEW_LABELS[t] || t)}</b><span>task: ${esc(t)}</span></div>
        <button class="b sm" onclick="pickTaskModel('${esc(t)}')">Change model</button></div>
      <div class="chain" id="chain_${esc(t)}">
        ${chain.map((id, i) => { const m = meta(id); return `<span class="hpill ${hp(m ? m.health : 'unknown')}" title="fallback position ${i + 1}">${i === 0 ? 'primary: ' : ''}${esc(id)}${m && m.usage && m.usage.count ? ' · ' + m.usage.count + ' today' : ''}</span>`; }).join('<span class="hint">→</span>')}
        ${chain.length ? '' : '<span class="hint">automatic</span>'}
      </div>
      <div id="pick_${esc(t)}" style="display:none;margin-top:6px"></div>
    </div>`;
  }).join('')}
  <div class="testout" id="be_out" style="display:none"></div>`;
}
/** pickTaskModel — move a compatible model to the front of a task's chain. Saving order = routing;
 *  only models with the task's own capability (and usable over REST) are offered. */
function pickTaskModel(task) {
  const def = (SETTINGS.tasks || {})[task] || {};
  const cap = def.capability || 'llm';
  const compatible = (SETTINGS.models || []).filter(m => m.enabled !== false && (m.capabilities || []).includes(cap) && !/(-live|live-|native-audio)/i.test(m.id));
  const host = $('pick_' + task);
  if (!host) return;
  if (host.style.display !== 'none') { host.style.display = 'none'; return; }
  host.style.display = 'block';
  host.innerHTML = `<div class="srow"><select id="pk_${esc(task)}" style="max-width:340px">
      ${compatible.map(m => `<option value="${esc(m.id)}" ${(SETTINGS.routing.tasks[task] || [])[0] === m.id ? 'selected' : ''}>${esc(m.displayName)} (${esc(m.id)})</option>`).join('')}
    </select>
    <button class="b sm pri" onclick="setTaskPrimary('${esc(task)}')">Make primary</button>
    <button class="b sm gh" onclick="$('pick_${esc(task)}').style.display='none'">Cancel</button></div>
    <div class="hint">Only models with the “${esc(cap)}” capability are listed — a text-only model can never be picked for vision or TTS. The chosen model leads; the rest of the chain stays behind it as fallback.</div>`;
}
async function setTaskPrimary(task) {
  const id = ($('pk_' + task) || {}).value;
  if (!id) return;
  const chain = (SETTINGS.routing.tasks[task] || []).slice();
  const next = [id, ...chain.filter(x => x !== id)];
  try {
    await api('/api/v2/settings/routing', { tasks: { [task]: next } });
    const el = $('be_out');
    if (el) { el.style.display = 'block'; el.className = 'testout ok'; el.textContent = '✓ ' + task + ' now leads with ' + id + ' (saved — survives restart)'; }
    SETTINGS = await api('/api/v2/settings');
    renderSettings();
  } catch (e) { toast(e.message, true); }
}

  const s = String(st || 'UNKNOWN');

  return `<span class="hpill ${cls}">${esc(s)}</span>`;
}
function tabKeys() {
  const pool = SETTINGS.poolKeys || [];
  const creds = SETTINGS.credentials || [];
  return `

    <div class="hint">Pool keys are round-robined by the router. Statuses come from real lightweight checks (list models with your key — no quota spend). Full values appear only when you press Reveal.</div></div>

    <div class="srow" style="margin-bottom:5px">

      <button class="b sm gh" onclick="delPoolKey(${k.index})">✕</button>

  <div class="fld"><label>Add a key</label>
    <div class="srow"><input id="nk_key" type="password" autocomplete="off" placeholder="paste the API key" style="flex:1">
      <input id="nk_label" placeholder="label (optional)" style="max-width:170px">
      <button class="b sm pri" onclick="addPoolKey()">Test & save</button></div>
    <div class="hint">The key is tested against the provider first; an invalid key is refused, not stored.</div></div>
  <div class="testout" id="keys_out" style="display:none"></div>
  <div class="fld" style="margin-top:10px"><label>Registered credentials — for separate projects / workloads / failover</label>

      <div class="k"><b>${esc(c.label)}</b><span>${esc(c.keyMasked || 'no key')} · used today ${c.usage.used}${c.usage.rpd ? ' / ' + c.usage.rpd : ''}${c.cooldown ? ' · cooling down' : ''}</span></div>

    <button class="b sm" onclick="addCredential()">+ Add credential</button>
    <div id="credform"></div></div>`;
}
async function refreshKeys(msg) {
  SETTINGS = await api('/api/v2/settings');
  try { const r = await api('/api/v2/keys'); SETTINGS.poolKeys = r.keys; } catch (_) { SETTINGS.poolKeys = SETTINGS.poolKeys || []; }
  renderSettings();
  if (msg) { const el = $('keys_out'); if (el) { el.style.display = 'block'; el.className = 'testout ok'; el.textContent = '✓ ' + msg; } }
}
async function addPoolKey() {
  const key = ($('nk_key') || {}).value || '';
  if (!key.trim()) return toast('paste a key first', true);
  const el = $('keys_out');
  if (el) { el.style.display = 'block'; el.className = 'testout'; el.textContent = 'testing the key against the provider…'; }
  try {
    const r = await api('/api/v2/keys', { action: 'add', key: key.trim() });
    if (!r.ok) { if (el) { el.className = 'testout no'; el.textContent = '✗ ' + (r.status || 'failed') + (r.detail ? ' — ' + r.detail : ''); } return; }
    $('nk_key').value = ''; if ($('nk_label')) $('nk_label').value = '';
    await refreshKeys('key saved: ' + r.masked + (r.tested && r.tested.status ? ' (' + r.tested.status + ')' : ''));
  } catch (e) { if (el) { el.className = 'testout no'; el.textContent = '✗ ' + e.message; } }
}
async function testPoolKey(i) {
  const cell = $('kst_' + i);
  if (cell) cell.innerHTML = '<span class="hpill unknown">testing…</span>';
  try {
    const r = await api('/api/v2/keys', { action: 'test', index: i });
    if (cell) cell.innerHTML = keyStatusPill(r.status);
    const el = $('keys_out');
    if (el) { el.style.display = 'block'; el.className = 'testout ' + (r.ok ? 'ok' : 'no'); el.textContent = (r.ok ? '✓ ' : '✗ ') + (r.masked || '') + ' → ' + (r.status || '') + (r.detail ? ' — ' + r.detail : '') + (r.latencyMs ? ' (' + r.latencyMs + 'ms)' : ''); }
  } catch (e) { if (cell) cell.innerHTML = keyStatusPill('PROVIDER ERROR'); }
}
async function testAllKeys() {
  const el = $('keys_out');
  if (el) { el.style.display = 'block'; el.className = 'testout'; el.textContent = 'testing every key (lightweight — no generation)…'; }
  try {
    const r = await api('/api/v2/keys', { action: 'test_all' });
    for (const res of r.results || []) { const cell = $('kst_' + res.index); if (cell) cell.innerHTML = keyStatusPill(res.status); }
    if (el) { const good = (r.results || []).filter(x => x.ok).length; el.className = 'testout ' + (good === (r.results || []).length ? 'ok' : 'no'); el.textContent = `${good}/${(r.results || []).length} keys ready — ${(r.results || []).map(x => (x.masked || '').slice(-4) + ':' + x.status).join(', ')}`; }
  } catch (e) { if (el) { el.className = 'testout no'; el.textContent = '✗ ' + e.message; } }
}
async function revealPoolKey(i) {
  try {
    const r = await api('/api/v2/keys', { action: 'reveal', index: i });
    const cell = $('kmask_' + i);
    if (cell) { const masked = cell.textContent; cell.textContent = r.key; cell.onclick = () => { cell.textContent = masked; cell.onclick = null; }; }
    toast('Revealed locally — click the key to re-mask');
  } catch (e) { toast(e.message, true); }
}
async function copyPoolKey(i) {

    const r = await api('/api/v2/keys', { action: 'reveal', index: i });

    toast('Key copied to the clipboard');
  } catch (e) { toast('copy failed: ' + e.message, true); }
}
async function delPoolKey(i) {
  if (!confirm('Remove this key from the pool? The router stops using it immediately.')) return;
  try { const r = await api('/api/v2/keys', { action: 'delete', index: i }); await refreshKeys('key removed — ' + r.remaining + ' left'); }
  catch (e) { toast(e.message, true); }
}
async function revealCredential(id) {

/* ==========================================================================================
   EDITOR CORE
   One playback clock, one set of real tracks, one transcript, one caption track, one selection.
   Every panel renders from the API payloads below — no panel keeps its own copy of the truth, so
   the timeline, transcript and canvas cannot disagree about the video.
   ========================================================================================== */
let TL = null, CAPS = null, TR = null, TREE = null, DRAWER = null, SG = null;
let ESIG = '', TAB = 'transcript', RIGHT = 'agent', VIEW = 'current', FOCUS = null;
let SEL = null, CUR_TR = null, PZ = 1, PPS = 24, BLKIDX = [], SEGIDX = [], SGX = [];
let RAFLoop = null, ACTIVE_SIG = '', lastTime = 0;
const IGNORED = JSON.parse(localStorage.getItem('studio_ignored') || '{}');

/* ------------------------------------------------ one playback clock */
function videoEl() { const v = $('stage'); return v ? v.querySelector('video') : null; }
function playhead() { const v = videoEl(); return v ? (v.currentTime || 0) : 0; }
function seekTo(t) {
  const v = videoEl();
  if (v) { try { v.currentTime = Math.max(0, Math.min(t, v.duration || t)); } catch (_) {} }
  drawPlayhead();
}
function tickStep(dur) {
  const want = 11, raw = Math.max(0.5, dur / want);
  for (const s of [0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300]) if (raw <= s) return s;
  return 600;
}
function currentPPS() { const v = videoEl(); const d = (TL && TL.duration) || (v && v.duration) || 0; return PPS; }
function drawPlayhead() {
  const t = playhead();
  const ph = $('ph');
  if (ph) ph.style.left = (t * PPS).toFixed(1) + 'px';
  const tn = $('tNow'); if (tn) tn.textContent = t.toFixed(1) + 's';
  const sig = activeSignature(t);
  if (sig !== ACTIVE_SIG) {

/* ------------------------------------------------ caption canvas (direct manipulation) */
function canvasTexts() {
  const box = $('stage').querySelector('.cvbox');
  if (!box) return;
  [...box.querySelectorAll('.cvotext')].forEach(e => e.remove());
  const trackId = CAPS && CAPS.active && CAPS.active.id;
  if (!trackId) return;
  const track = (CAPS.tracks || []).find(x => x.id === trackId);
  if (!track) return;
  const t = playhead();
  const st = track.style || {};
  const active = (track.segments || []).filter(s => t >= s.start - 0.05 && t <= s.end + 0.05);
  const selSeg = SEL && SEL.kind === 'caption' ? (track.segments || []).find(s => s.id === SEL.segment) : null;
  if (selSeg && !active.some(s => s.id === selSeg.id)) active.push(selSeg);
  for (const s of active) {
    const sty = { ...st, ...(s.style || {}) };
    const al = (s.style && s.style.align) || s.position || st.align || 'bottom';
    const xp = /left/.test(al) ? '8%' : /right/.test(al) ? '' : '50%';
    const el = document.createElement('div');
    el.className = 'cvotext' + (selSeg && selSeg.id === s.id ? ' sel' : '');
    el.dataset.seg = s.id;
    el.textContent = s.display || s.text;
    el.style.fontSize = Math.max(9, Math.round((sty.size || 60) * (box.clientHeight / 1920))) + 'px';
    el.style.top = ((sty.y == null ? 88 : sty.y) / 100 * 100) + '%';
    el.style.transform = xp === '50%' ? 'translate(-50%,-50%)' : /right/.test(al) ? 'translate(0,-50%)' : 'translate(-50%,-50%)';

    else el.style.left = '50%';
    if (sty.background) el.style.background = 'rgba(0,0,0,.55)';
    if (sty.uppercase) el.textContent = el.textContent.toUpperCase();

    box.appendChild(el);

function renderVersions() {
  const panel = $('dpanel');
  if (!TREE || !TREE.nodes || TREE.nodes.length <= 1) { panel.innerHTML = '<div class="mono">No versions yet. Every operation appends a version — nothing is ever overwritten, so this list is the whole history of the cut.</div>'; return; }
  const byParent = {};
  TREE.nodes.forEach(n => { (byParent[n.parent || 'root'] = byParent[n.parent || 'root'] || []).push(n); });
  const rows = [];
  const walk = (pid, depth) => {
    for (const n of (byParent[pid] || [])) {
      rows.push('<div class="vnode' + (n.current ? ' cur' : '') + '" onclick="pickVersion(\'' + esc(n.id) + '\')" title="' + esc(n.opLabel + ' v' + n.version + (n.duration ? ' · ' + n.duration + 's' : '')) + '">' +
        '<span class="br">' + (depth ? '└─' : '●') + '</span><span class="num">v' + (n.version || 0) + '</span>' +
        '<span class="op">' + esc(n.opLabel) + '</span><span class="lb">' + esc(n.label) + (n.current ? ' <b style="color:var(--ac2)">current</b>' : '') + '</span>' +
        '<span class="time">' + (n.duration ? Number(n.duration).toFixed(1) + 's' : '') + ' · ' + (n.ts ? when(n.ts) : '') + '</span></div>');
      walk(n.id, depth + 1);
    }
  };
  walk('root', 0);
  walk(null, 0);
  panel.innerHTML = '<div class="dhd"><span class="tsrc">click a version to make it current — instant, nothing is re-rendered or deleted</span><div class="grow"></div><span class="tsrc">' + TREE.nodes.length + ' nodes · ' + TREE.edges.length + ' parent links</span></div>' + rows.join('');

let PMATCH = CMDS, PSEL = 0;
function openPalette() { $('palette').classList.add('on'); const i = $('pinput'); i.value = ''; PMATCH = CMDS; PSEL = 0; paintPalette(); i.focus(); }
function closePalette() { $('palette').classList.remove('on'); }
function filterPalette() {
  const q = $('pinput').value.toLowerCase().trim();
  PMATCH = CMDS.filter(c => !q || c.k.split(' ').some(w => w.toLowerCase().startsWith(q)) || c.k.toLowerCase().includes(q));
  PSEL = 0; paintPalette();
}
function paintPalette() {
  $('plist').innerHTML = PMATCH.length ? PMATCH.map((c, i) => '<div class="pitem' + (i === PSEL ? ' on' : '') + '" onclick="runCmd(' + i + ')"><span>' + esc(c.k) + '</span><span class="k">enter</span></div>').join('') : '<div class="pitem">no matching command</div>';
}
function runCmd(i) { const c = PMATCH[i]; closePalette(); if (c) c.h(); }
function paletteKey(e) {
  if (e.key === 'Escape') return closePalette();
  if (e.key === 'ArrowDown') { e.preventDefault(); PSEL = Math.min(PMATCH.length - 1, PSEL + 1); paintPalette(); }
  if (e.key === 'ArrowUp') { e.preventDefault(); PSEL = Math.max(0, PSEL - 1); paintPalette(); }
  if (e.key === 'Enter') { e.preventDefault(); runCmd(PSEL); }
}

/* ==================================================================================
   PLAN / DIFF — show what a change WOULD do before it runs, and let the owner
deactivate individual steps. The diff is computed by the backend from structured
   operations, so it cannot describe something the pipeline would not do.
   ================================================================================== */
let LAST_PLAN = null;
async function showPlanDiff(ops, opts) {
  opts = opts || {};
  const p = STATE && STATE.project;
  if (!p) { toast('Open a project first', true); return; }
  let d;
  try { d = await api('/api/v2/plan/preview', { project: p.id, ops }); }
  catch (e) { toast(e.message, true); return; }
  LAST_PLAN = d;
  if (!d.ops.length && !d.blocked.length) { toast('Nothing to preview', true); return; }
  const rows = d.ops.map((o, i) => `
    <div class="drow" id="drow-${i}">
      <div class="lbl">${esc(o.layer || o.op)}${o.requiresApproval ? ' <span class="pill waiting">review</span>' : ''}</div>
      <label class="dchk"><input type="checkbox" checked onchange="togglePlanOp(${i}, this.checked)">
        <span class="vals">
          <span class="mono" style="color:var(--tx3)">${esc(o.op)}</span>
          <span class="to">${esc(planRowFor(d, o) || '—')}</span>
          ${o.reason ? `<span class="hint">${esc(o.reason)}</span>` : ''}
        </span></label>
    </div>`).join('');
  const blocked = (d.blocked || []).map(b => `
    <div class="drow blk">
      <div class="lbl">${esc((LOCKS && (LOCKS.layers || []).find(l => l.key === b.layer) || {}).label || b.layer)} 🔒</div>
      <div class="vals"><span class="from">${esc(b.op)}</span>
        <span class="hint">${esc(b.error || 'refused — the layer is locked')}</span></div>
    </div>`).join('');
  const held = (d.diff && d.diff.held || []).map(h => `
    <div class="drow held"><div class="lbl">${esc(h.label)} 🔒</div>
      <div class="vals"><span>${esc(h.from)}</span><span class="to">unchanged (locked)</span></div></div>`).join('');
  const skip = (d.skippedByUser || []).map(s => `
    <div class="drow"><div class="lbl">${esc(s.op)}</div><div class="vals"><span class="hint">you switched this off</span></div></div>`).join('');
  modal('Proposed changes' + (opts.title ? ' — ' + opts.title : ''), `
    <p class="hint" style="margin-bottom:10px">${esc(d.note || '')}</p>
    ${rows || '<p class="hint">no operations will run</p>'}
    ${blocked}
    ${held}
    ${skip}
    ${(d.blocked || []).length ? `<p class="hint" style="margin-top:10px;color:var(--warn)">${d.blocked.length} operation(s) were refused because that layer is locked. Unlock it to include them.</p>` : ''}`,
    `<button class="b gh" onclick="closeModal()">Cancel</button>
     <div class="grow"></div>
     <button class="b gh" onclick="editPlanAsChat()">Edit plan</button>
     <button class="b pri" onclick="applyPlan()">Apply ${d.ops.length} change(s)</button>`);
}
/** Describe one operation in the diff's own vocabulary (the row already carries the values). */
function planRowFor(d, o) {
  const row = (d.diff && d.diff.rows || []).find(r => r.op === o.op && r.layer === o.layer);
  return row ? (row.from + '  →  ' + row.to) : JSON.stringify(o.args).slice(0, 120);
}
function togglePlanOp(i, on) {
  if (!LAST_PLAN) return;
  const el = $('drow-' + i);
  if (el) el.querySelector('.dchk').className = 'dchk' + (on ? '' : ' dis');
  LAST_PLAN.ops[i]._on = on;
}
function editPlanAsChat() {
  const list = (LAST_PLAN && LAST_PLAN.ops || []).map(o => o.op + ' ' + JSON.stringify(o.args)).join('\n');
  closeModal();
  $('composer').value = 'Change this plan before running it:\n' + list + '\n\nWhat I actually want: ';
  $('composer').focus();
}
async function applyPlan() {
  if (!LAST_PLAN) return;
  const ops = LAST_PLAN.ops.filter(o => o._on !== false).map(o => ({ op: o.op, args: o.args }));
  closeModal();
  if (!ops.length) return toast('Every step was switched off', true);
  try {
    const d = await api('/api/v2/plan', { page: PAGE.key, project: STATE.project.id, ops });
    toast('Running ' + d.steps + ' step(s)' + ((d.blocked || []).length ? ' — ' + d.blocked.length + ' refused (locked)' : ''));
    LAST_PLAN = null;
    await refresh(); waitJob(d.jobId);
  } catch (e) { toast(e.message, true); }
}

/* ==================================================================================
   MASTER EDIT + PAGE BRANCHES
   The master is a normal project; approving it is what unlocks fanning out. Locks set
   on the master are inherited by every branch and cannot be released down there.
