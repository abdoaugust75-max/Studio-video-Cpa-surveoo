  const mine = suites.find(s => s.id === (p.suite || '')) || suites[0] || null;
  const done = p.role === 'master' && p.masterStatus === 'approved';
  modal('Master edit & page versions', `
    <p class="hint" style="margin-bottom:12px">A <b>master edit</b> holds the work that is true for every page — the cut, the framing, the basic audio. Approve it once, then fan it out into page versions. Each branch inherits the master's locks and reuses its transcript instead of re-transcribing.</p>
    <div class="fld"><label>Current project</label>
      <div class="prow"><span class="k">${esc(p.title)}</span>
        <span class="pill ${esc(p.role === 'master' ? (p.masterStatus || 'draft') : p.role)}">${esc(p.role)}${p.role === 'master' ? ' · ' + esc(p.masterStatus || 'draft') : ''}</span></div></div>
    ${suites.length ? `<div class="fld"><label>Suite</label>
      <div class="prow"><span class="k">${esc(mine.title)} · ${mine.branches} version(s)</span>
      <button class="b sm gh" onclick="closeModal();openComparison('${esc(mine.id)}')">Compare</button></div></div>` : ''}
    <div class="fld"><label>${p.role === 'master' ? 'Approve this master' : 'Start a master edit'}</label>
      <div class="ractions">
        ${p.role === 'master'
          ? (done ? `<span class="hint">Approved — page versions can be generated from it.</span>
                     <button class="b sm gh" onclick="masterApprove('draft')">Send back to draft</button>`
                  : `<button class="b sm pri" onclick="masterApprove('approved')">✓ Approve master</button>
                     <button class="b sm gh" onclick="masterApprove('rejected')">✕ Reject</button>`)
          : `<button class="b sm" onclick="startMaster()">Start a master from this project</button>
             <span class="hint">Uses this project's current cut as the master's starting point — the file is referenced, not copied.</span>`}
      </div></div>`,
    p.role === 'master' ? `<div class="grow"></div><button class="b pri" onclick="closeModal();openBranchPicker('${esc(p.suite || '')}')">Generate page versions →</button>` : '');
}
async function startMaster() {
  const p = STATE.project;

  try {

    toast('Master ' + status);

  } catch (e) { toast(e.message, true); }

/* ---- generating page versions: choose pages, then one job per branch ---- */
let BRANCH_SEL = {};
async function openBranchPicker(suiteId) {
  const p = STATE.project;
  const suite = suiteId || (p && p.suite) || '';
  if (!suite) return toast('This project is not part of a suite', true);
  const checked = {};
  for (const pg of PAGES) checked[pg.key] = pg.key !== p.page;
  BRANCH_SEL = checked;
  modal('Generate page versions', `
    <p class="hint" style="margin-bottom:12px">Each selected page agent gets its own version of the approved master: its own hook text, its own caption preset, its own voice when supplied. Branches render one at a time and a failure in one does not stop the others.</p>
    <div class="fld"><label>Page agents</label><div class="branches">${PAGES.map(pg =>
      `<label class="dchk" style="padding:5px 0"><input type="checkbox" ${checked[pg.key] ? 'checked' : ''} onchange="BRANCH_SEL['${esc(pg.key)}']=this.checked">
        <span class="vals"><span style="color:var(--tx)">${esc(pg.label)}</span>
        <span class="hint">${esc(pg.lang)} · voice ${esc(pg.voice || '—')} · ${esc(pg.ratio || '9:16')}${pg.prefs && pg.prefs.cta ? ' · CTA set' : ' · no CTA (hook will be skipped)'}</span></span></label>`).join('')}</div></div>
    <p class="hint">A page with no hook text and no script still gets a version — it just reports those steps as skipped rather than inventing them.</p>`,
    `<button class="b gh" onclick="closeModal()">Cancel</button><div class="grow"></div>
     <button class="b pri" onclick="generateBranches('${esc(suite)}')">Generate</button>`);
}
async function generateBranches(suiteId) {
  // Read the checkboxes themselves: the DOM is the source of truth for what the owner ticked, so a
  // stale module variable can never disagree with what is on screen.
  const boxes = [...document.querySelectorAll('#modals .dchk input')];
  const pages = boxes.map((b, i) => (b.checked ? PAGES[i].key : null)).filter(Boolean);
  if (!pages.length) return toast('Select at least one page agent', true);
  try {
    const d = await api('/api/v2/suite/generate', { page: PAGE.key, suite: suiteId, pages });
    closeModal();
    toast('Generating ' + pages.length + ' page version(s)…');
    const j = await waitJob(d.jobId);
    toast(j && j.result ? (j.result.ready + ' ready' + (j.result.failed ? ', ' + j.result.failed + ' failed' : '')) : 'done');
    syncReview(); refreshReviewBadge();
  } catch (e) { toast(e.message, true); }
}

/* ==================================================================================
   REVIEW MODE — the queue is derived from persisted project state, so what is shown
   here is what survives a reload and a restart.
   ================================================================================== */
async function refreshReviewBadge() {
  try {
    const d = await api('/api/v2/review' + (PAGE ? '?page=' + encodeURIComponent(PAGE.key) : ''));
    // The old header Review badge is gone; the queue still feeds artifact cards their
    // approved/needs-changes state, and pending decisions surface in the chat itself.
    for (const it of d.items || []) if (it.project) REVIEW_MAP[it.project] = it.state;
    return d;
  } catch (_) { return null; }
}
async function syncReview() {
  $('rvBody').className = 'vbody';
  $('rvBody').innerHTML = '<p class="hint">Loading the review queue…</p>';
  let d;
  try { d = await api('/api/v2/review?page=' + encodeURIComponent(PAGE.key)); }
  catch (e) { $('rvBody').innerHTML = `<p class="hint">${esc(e.message)}</p>`; return; }
  RV.items = d.items || [];
  $('rvNote').textContent = d.total ? (d.total + ' item(s) — ' + Object.entries(d.counts).map(([k, v]) => v + ' ' + k).join(', ')) : 'nothing is waiting';
  if (!RV.items.length) {
    $('rvBody').innerHTML = `<div class="empty" style="margin:auto;text-align:center">
      <h2>Nothing waiting for you</h2>
      <p>Approve a master, generate page versions, or pause an edit on a checkpoint — anything that needs a decision lands here.</p>
      <button class="b sm" onclick="setAppMode('create')">Back to Create</button></div>`;
    return;
  }
  if (!RV.sel || !RV.items.some(x => x.project === RV.sel)) RV.sel = RV.items[0].project;
  await paintReview();
}
function rvRow(x) {
  return `<div class="rrow${x.project === RV.sel ? ' on' : ''}" onclick="pickReview('${esc(x.project)}')">
    <span class="pill ${esc(x.state)}">${esc(x.state)}</span>
    <span class="t">${esc((x.title || x.project).slice(0, 52))}</span>
    <span class="grow"></span>
    <span class="hint">${esc(x.kind || '')}${x.role ? ' · ' + esc(x.role) : ''}</span></div>`;
}
async function paintReview() {
  const sel = RV.items.find(x => x.project === RV.sel) || RV.items[0];
  if (!sel) return;
  const waiting = RV.items.filter(x => x.state === 'waiting');
  let p = null;
  try { p = (await api('/api/v2/project?id=' + encodeURIComponent(sel.project))).project; } catch (_) {}
  let art = null;
  try { const d = await api('/api/v2/project?id=' + encodeURIComponent(sel.project)); art = (d.artifacts || []).find(a => a.id === p.current) || (d.artifacts || []).slice(-1)[0]; } catch (_) {}
  const isVideo = art && art.kind === 'video';
  const note = (sel.pending && sel.pending.label) || sel.note || '';
  // PERFORMANCE uses the same body class but is a single scrolling column.
  $('rvBody').className = 'vbody';
  $('rvBody').innerHTML = `
    <div class="rvcol">
      <div class="rcap">Queue — ${RV.items.length} item(s)</div>
      <div class="rrows">${RV.items.map(rvRow).join('')}</div>
      ${waiting.length > 1 ? `<div class="rcap">Batch</div>
      <div class="ractions" style="padding:0">
        <button class="b sm gh" onclick="batchApprove('waiting','approve')">✓ Approve all ${waiting.length} waiting</button>
        <button class="b sm gh" onclick="openBatchCorrect()">⇄ One correction for several…</button>
      </div>` : ''}
    </div>
    <div class="rvcol">
    <div class="rcap">Decision</div>
    <div class="rbig">
      <div>
        <div class="player">${isVideo
          ? `<video id="rvVid" src="${esc(art.rel)}" controls preload="metadata"></video>`
          : art && art.kind === 'audio' ? `<audio src="${esc(art.rel)}" controls style="width:90%"></audio>`
          : '<span class="hint">this item has no playable artifact yet</span>'}</div>
        <div class="ractions">
          <button class="b pri" onclick="rvDecide('approved')">✓ Approve</button>
          <button class="b" onclick="rvFix()">✏ Fix…</button>
          <button class="b" onclick="rvRegen()">⟳ Regenerate</button>
          <button class="b gh" onclick="rvDecide('rejected')">✕ Reject</button>
          <button class="b gh" onclick="closeReviewOpen()">Open in Create</button>
          ${p && p.suite ? `<button class="b gh" onclick="openComparison('${esc(p.suite)}')">Compare all versions</button>` : ''}
        </div>
      </div>
      <div>
        <div class="rcap">This item</div>
        <div class="prow"><span class="k">${esc(sel.title || sel.project)}</span><span class="pill ${esc(sel.state)}">${esc(sel.state)}</span></div>
        <div class="mono" style="font-size:10.5px;color:var(--tx4);padding:8px 0">
          project ${esc(sel.project)}<br>
          page ${esc(sel.page)} · ${esc(sel.role || 'standalone')}<br>
          artifact ${esc(art ? art.id : '—')}<br>
          ${art ? esc(art.label || '') + '<br>' + (art.probe && art.probe.duration ? esc(art.probe.duration.toFixed(2)) + 's · ' : '') + (art.probe && art.probe.width ? esc(art.probe.width + '×' + art.probe.height) : '') : ''}
        </div>
        ${note ? `<div class="ibox info"><div class="h">What needs deciding</div><div class="d">${esc(note)}</div></div>` : ''}
      </div>
    </div>
    </div>`;
}
function pickReview(id) { RV.sel = id; paintReview(); }
function closeReviewOpen() {
  setAppMode('create');
  if (RV.sel) { openProject(RV.sel).then(() => { refresh(); syncLocks(); }); }
}
async function rvDecide(state) {
  const note = state === 'rejected' ? (prompt('Why reject it? (optional)') || '') : '';
  try {
    await api('/api/v2/review/decision', { project: RV.sel, state, note });
    toast('Recorded: ' + state);
    await syncReview(); refreshReviewBadge();
  } catch (e) { toast(e.message, true); }
}
async function rvFix() {
  const note = prompt('What should change? (this correction is applied to THIS version only)');
  if (note == null) return;
  try {
    await api('/api/v2/review/decision', { project: RV.sel, state: 'fix_requested', note });
    toast('Fix requested — sent to ' + RV.sel);
    await syncReview(); refreshReviewBadge();
  } catch (e) { toast(e.message, true); }
}
async function rvRegen() {
  const only = prompt('Regenerate which layer? all / hook / captions / tts / music', 'all');
  if (!only) return;
  try {
    const d = await api('/api/v2/branch/regenerate', { branch: RV.sel, only });
    toast('Regenerated ' + (d.mode || only));
    await syncReview();
  } catch (e) { toast(e.message, true); }
}

/* ---- comparison grid: one real, playable card per version ---- */
async function openComparison(suiteId) {
  let d;
  try { d = await api('/api/v2/suite?suite=' + encodeURIComponent(suiteId)); }
  catch (e) { return toast(e.message, true); }
  const card = (c, isMaster) => {
    const act = (c) => c.current && c.current.kind === 'video' ? 'video' : (c.current && c.current.kind === 'audio' ? 'audio' : 'none');
    const a = act(c);
    return `<div class="bcard${c.project === RV.sel ? ' sel' : ''}">
      <div class="bt"><b>${esc(c.pageLabel || c.page)}</b>
        <span class="st">${esc(c.status)}</span></div>
      ${a === 'video' ? `<video src="${esc(c.preview || c.current.rel)}" controls preload="metadata"></video>`
        : a === 'audio' ? `<audio src="${esc(c.current.rel)}" controls></audio>`
        : `<div style="aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center"><span class="hint">no artifact yet</span></div>`}
      <div class="bm">
        <div class="meta">${c.current ? esc(c.current.op + ' v' + c.current.version + (c.current.duration ? ' · ' + c.current.duration.toFixed(1) + 's' : '')) : '—'} · ${c.versions} version(s)</div>
        ${(c.steps || []).length ? `<div class="bskip">${c.steps.map(s => esc(s.op || '')).join(', ')}</div>` : ''}
        ${(c.skipped || []).length ? `<div class="bskip">skipped: ${c.skipped.slice(0, 2).map(s => esc(s.op)).join(', ')}</div>` : ''}
        ${(c.locks || []).length ? `<div class="bskip">locked: ${c.locks.map(l => esc(l.label) + (l.inherited ? '↑' : '')).join(', ')}</div>` : ''}
      </div>
      <div class="acts">
        <button class="b sm gh" onclick="closeModal();openProjFromReview('${esc(c.project)}')">Open</button>
        <button class="b sm gh" onclick="rvApproveOne('${esc(c.project)}')">✓</button>
        ${isMaster ? '' : `<button class="b sm gh" onclick="rvRegenOne('${esc(c.project)}')">⟳</button>`}
      </div></div>`;
  };
  // Remember WHICH version ids are on screen. "Approve all shown" must act on the cards in front of
  // the owner, not on whatever project happens to be open in Create behind this modal.
  CMP = { suite: d.suite.id, master: d.master ? d.master.project : null, branches: d.branches.map(b => b.project) };
  modal('All versions — ' + d.suite.title, `
    <p class="hint" style="margin-bottom:10px">${esc(d.note || '')}</p>
    <div class="rcap">Master</div>
    <div class="rgrid">${d.master ? card(d.master, true) : '<p class="hint">no master</p>'}</div>
    <div class="rcap" style="margin-top:12px">Page versions (${d.branches.length})</div>
    <div class="rgrid">${d.branches.length ? d.branches.map(c => card(c, false)).join('') : '<p class="hint">none generated yet</p>'}</div>`,
    `<button class="b gh" onclick="closeModal()">Back to Studio</button><div class="grow"></div>
     <button class="b" onclick="batchApproveBranches('approve')">✓ Approve all shown</button>`);
}
function openProjFromReview(id) { setAppMode('create'); openProject(id).then(() => { refresh(); syncLocks(); }); }
async function rvApproveOne(id) {
  try { await api('/api/v2/review/decision', { project: id, state: 'approved', note: 'approved' }); toast('Approved'); syncReview(); refreshReviewBadge(); } catch (e) { toast(e.message, true); }
}
async function rvRegenOne(id) {
  const only = prompt('Regenerate which layer? all / hook / captions / tts / music', 'all');
  if (!only) return;
  try { await api('/api/v2/branch/regenerate', { branch: id, only }); toast('Regenerated ' + only); syncReview(); } catch (e) { toast(e.message, true); }
}

/* ---- batch: one deterministic correction or decision across several versions ---- */
async function batchApprove(state, decision) {
  const items = RV.items.filter(x => !state || x.state === state).map(x => x.project);
  if (!items.length) return toast('Nothing to apply that to', true);
  if (!confirm('Apply "' + decision + '" to ' + items.length + ' version(s)?\n\nEach one records its own decision; nothing is merged.')) return;
  try { const d = await api('/api/v2/batch/approve', { branches: items, decision, note: 'batch from Review' }); toast(d.count + ' version(s) → ' + d.decision); syncReview(); refreshReviewBadge(); }
  catch (e) { toast(e.message, true); }
}
let CMP = { suite: null, master: null, branches: [] };
async function batchApproveBranches(decision) {
  const ids = (CMP.branches || []).slice();
  if (!ids.length) return toast('No page versions are on screen', true);
  if (!confirm('Apply "' + decision + '" to all ' + ids.length + ' version(s) shown?')) return;
  try {
    const r = await api('/api/v2/batch/approve', { branches: ids, decision, note: 'batch approve from the comparison grid' });
    toast(r.count + ' version(s) → ' + r.decision);
    closeModal(); await syncReview(); refreshReviewBadge();
  } catch (e) { toast(e.message, true); }
}
// The full vocabulary the backend supports. `caption_preset` takes a preset NAME, not a number, so
// the form swaps its input type for it — a number field silently discards a preset name.
const CORRECTIONS = [
  ['music_volume', 'Music volume', 'number', '0.12'],
  ['audio_volume', 'Original audio level', 'number', '1'],
  ['text_size', 'Hook text size', 'number', '52'],
  ['tts_rate', 'Voice speed', 'number', '1.05'],
  ['speed', 'Playback speed', 'number', '1.1'],
  ['caption_preset', 'Caption preset', 'preset', ''],
];
let BC_TARGETS = [];
async function openBatchCorrect() {
  const branches = RV.items.filter(x => x.role === 'branch' || x.kind === 'branch').map(x => x.project);
  const targets = branches.length ? branches : RV.items.map(x => x.project);
  if (!targets.length) return toast('Nothing to correct', true);
  BC_TARGETS = targets;
  let presets = {};
  try { presets = (await api('/api/v2/captions')).presets || {}; } catch (_) {}
  const presetKeys = Object.keys(presets);
  window.BC_PRESETS = presets;
  modal('One correction, several versions', `
    <p class="hint" style="margin-bottom:12px">This is one structured change re-issued against each version's own current value — no model is involved, so the same input always produces the same result. You will see exactly what changes, per version, before anything runs.</p>
    <div class="fld"><label>What to change</label>
      <select id="bc_kind" onchange="bcKindChanged()">${CORRECTIONS.map(c => `<option value="${c[0]}">${esc(c[1])}</option>`).join('')}</select></div>
    <div class="fld"><label id="bc_vlabel">New value</label><input id="bc_val" type="number" step="0.01" value="0.12">
      <div class="hint" id="bc_hint"></div></div>
    <div class="fld"><label>Versions (${targets.length})</label><div class="mono" style="font-size:10.5px;color:var(--tx4)">${targets.map(esc).join('<br>')}</div></div>`,
    `<button class="b gh" onclick="closeModal()">Cancel</button><div class="grow"></div>
     <button class="b" onclick="runBatchCorrect(true)">Preview</button>`);
  bcKindChanged();
}
function bcKindChanged() {
  const kind = $('bc_kind').value;
  const spec = CORRECTIONS.find(c => c[0] === kind) || [];
  const inp = $('bc_val'), hint = $('bc_hint');
  if (!inp) return;
  if (spec[2] === 'preset') {
    // swap the input for a select of the presets the renderer actually honours
    const sel = document.createElement('select');
    sel.id = 'bc_val';
    sel.innerHTML = Object.keys(window.BC_PRESETS || {}).map(k => `<option value="${esc(k)}">${esc((window.BC_PRESETS[k] || {}).label || k)}</option>`).join('');
    inp.replaceWith(sel);
    if (hint) hint.textContent = 'Presets the caption renderer actually honours.';
  } else if (inp.tagName !== 'INPUT') {
    const n = document.createElement('input');
    n.id = 'bc_val'; n.type = 'number'; n.step = '0.01'; n.value = spec[3] || '';
    inp.replaceWith(n);
    if (hint) hint.textContent = 'Range: ' + (spec[3] ? spec[0].replace(/_/g, ' ') : '');
  } else {
    inp.value = spec[3] || inp.value;
  }
}
// BC_KIND / BC_VALUE remember what was PREVIEWED. The confirm modal replaces the picker, so the
// Apply button cannot re-read the picker's inputs — reading them returned null and applying a batch
// always threw. Applying must use exactly the values the owner just approved.
let BC_KIND = null, BC_VALUE = null;
async function runBatchCorrect(dry) {
  if (dry !== false) {
    const el = $('bc_kind'), val = $('bc_val');
    if (!el || !val) return toast('Pick what to change first', true);
    const kind = el.value;
    if (!kind) return toast('Pick what to change first', true);
    const isPreset = (CORRECTIONS.find(c => c[0] === kind) || [])[2] === 'preset';
    const value = isPreset ? String(val.value).trim() : Number(val.value);
    if (isPreset && !value) return toast('Pick a preset', true);
    if (!isPreset && !isFinite(value)) return toast('Enter a number', true);
    BC_KIND = kind; BC_VALUE = value;
  } else if (!BC_KIND) {
    return toast('Preview the correction before applying it', true);
  }
  const kind = BC_KIND, value = BC_VALUE;
  const ids = BC_TARGETS.length ? BC_TARGETS : RV.items.map(x => x.project);
  let d;
  try { d = await api('/api/v2/batch/correct', { branches: ids, kind, value, dryRun: dry !== false }); }
  catch (e) { return toast(e.message, true); }
  if (dry === false) {
    closeModal(); toast(d.affected.length + ' version(s) queued'); syncReview(); return;
  }
  modal('Confirm — ' + d.label, `
    <p class="hint" style="margin-bottom:10px">${esc(d.note)}</p>
    <div class="rcap">Will change (${d.affected.length})</div>
    ${d.affected.map(r => `<div class="drow"><div class="lbl">${esc(r.pageLabel || r.page)}</div>
      <div class="vals"><span class="from">${esc(String(r.from))}</span><span class="to">${esc(String(r.to))}</span></div></div>`).join('') || '<p class="hint">nothing would change</p>'}
    ${d.skipped.length ? `<div class="rcap" style="margin-top:10px">Skipped (${d.skipped.length})</div>
      ${d.skipped.map(s => `<div class="drow blk"><div class="lbl">${esc(s.page || s.project)}</div>
        <div class="vals"><span class="hint">${esc(s.reason)}</span></div></div>`).join('')}` : ''}`,
    `<button class="b gh" onclick="closeModal()">Cancel</button><div class="grow"></div>
     <button class="b pri" ${d.affected.length ? '' : 'disabled'} onclick="runBatchCorrect(false)">Apply to ${d.affected.length}</button>`);
}

/* ==================================================================================
   PERFORMANCE — only metrics the platform actually returned. The insight list is
   arithmetic over those values and carries its own sample size; nothing is invented.
   ================================================================================== */
async function openPerf() {
  $('pfBody').className = 'vbody single';
  $('pfBody').innerHTML = '<p class="hint">Loading real platform metrics…</p>';
  let page = null, intel = null;
  try { page = await api('/api/v2/analytics/page?page=' + encodeURIComponent(PAGE.key)); } catch (e) { $('pfBody').innerHTML = `<p class="hint">${esc(e.message)}</p>`; return; }
  try { intel = await api('/api/v2/analytics/intel?page=' + encodeURIComponent(PAGE.key)); } catch (_) {}
  const pages = (page.pages || []).map(p => `<div class="prow"><span class="k">${esc(p.name)}
    <div class="hint">${esc(p.error || 'linked')}</div></span>
    <span class="v">${p.ok ? fmt(p.followers) + ' followers' : '—'}</span></div>`).join('') || '<p class="hint">No page linked to this agent yet.</p>';
  const posts = (page.posts || []).slice(0, 20).map(p => `<div class="prow">
    <span class="k">${esc(String(p.product || p.project || 'post').slice(0, 60))}
      <div class="hint">${p.ok ? 'published' : esc(p.error || 'unavailable')}</div></span>
    <span class="v">${p.ok ? fmt(p.views) + ' · ' + fmt(p.likes) + '♥ · ' + fmt(p.comments) + '💬' : '—'}</span>
    ${p.permalink ? `<a class="b sm gh" href="${esc(p.permalink)}" target="_blank">open</a>` : ''}
    <button class="b sm" onclick="makeVariation('${esc(String(p.id || p.post_id || ''))}')" title="Start a NEW project from this — the original is never touched">Create variation</button></div>`).join('') || '<p class="hint">No published posts tracked yet.</p>';
  const ins = (intel && intel.items || []).map(i => `<div class="ibox ${esc(i.severity || 'info')}">
    <div class="h">${esc(i.label)}</div><div class="d">${esc(i.detail)}</div>
    <div class="e">evidence: ${esc(i.evidence)}${i.sample ? ' · sample ' + i.sample : ''}</div></div>`).join('')
    || '<p class="hint">No insight can be drawn from the data returned so far.</p>';
  $('pfNote').textContent = page.updated_at ? 'updated ' + when(page.updated_at) : 'not synced yet';
  $('pfBody').innerHTML = `
    <div class="rcap">Pages</div>${pages}
    <div class="rcap">Insights — ${intel ? intel.posts : 0} post(s), metrics available: ${intel && intel.metricsAvailable.length ? intel.metricsAvailable.join(', ') : 'none'}</div>
    <div style="display:grid;gap:9px">${ins}</div>
    ${intel ? `<p class="hint">${esc(intel.disclaimer)}</p>` : ''}
    <div class="rcap">Published posts — live</div>${posts}
    <p class="hint">${esc(page.note || '')}</p>`;
}
async function makeVariation(postId) {
  try {
    const d = await api('/api/v2/variation', { page: PAGE.key, postId });
    toast(d.linked ? 'Variation project created — the original is untouched' : 'No local source matched that post; a new project was created for you');
    setAppMode('create');
    await selectProject(d.project); await refresh(); syncLocks();
  } catch (e) { toast(e.message, true); }
}

/* ------------------------------------------------ keyboard */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if (e.key === 'Escape') { if ($('palette').classList.contains('on')) return closePalette(); SEL = null; renderInspector(); renderTracks(); renderCanvas(); return closeModal(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); return openPalette(); }
  if (typing) return;
  if (e.code === 'Space') { const v = videoEl(); if (v) { e.preventDefault(); v.paused ? v.play().then(() => drawPlayhead()).catch(() => {}) : v.pause(); } return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); const d = (e.shiftKey ? 5 : 1) * (e.key === 'ArrowLeft' ? -1 : 1); seekTo(playhead() + d); }
});
window.addEventListener('resize', () => { syncHdr(); fit(); if (STATE && STATE.project) { renderTracks(); renderCanvas(); } });
setInterval(() => { if (STATE && STATE.jobs && STATE.jobs.some(j => j.status === 'running')) refresh(); }, 6000);
setInterval(drawPlayhead, 250);
fit();
bindTimeline();
setRight('agent');
syncHdr();
setTimeout(syncHdr, 300);
try { if (localStorage.getItem('vs_drawer_min') === '1') toggleDrawer(true); } catch (_) {}
// No URL, localStorage value, or stale bookmark can restore the removed editor UI.
document.body.dataset.ui = 'chat';
UI = document.body.dataset.ui === 'studio' ? 'studio' : 'chat';
boot();
// the review badge is a real count from the queue, refreshed with the same cadence as the studio
setInterval(() => { if (PAGE) refreshReviewBadge(); }, 20000);
</script>
