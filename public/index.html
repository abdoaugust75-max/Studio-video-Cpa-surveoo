<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio</title>
<style>
:root{
  --bg:#101214; --bg2:#15181b; --bg3:#1a1e22; --surf:#1c2024; --surf2:#24292e; --surf3:#2b3137;
  --line:#2a3036; --line2:#39414a; --line3:#4a5560;
  --tx:#f1f3f5; --tx2:#b2bac3; --tx3:#7e8994; --tx4:#5f6a75;
  --ac:#4f7cff; --ac2:#78a0ff; --acsoft:rgba(79,124,255,.14);
  --ok:#2ee08a; --warn:#ffb340; --err:#ff5470; --info:#4cc9f0;
  --r:12px; --r2:9px; --r3:7px;
  --mono:'SF Mono','Consolas',monospace;
  --shadow:0 8px 32px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--tx);overflow:hidden;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;height:100dvh;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--ac);color:#fff}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,textarea{font:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--line3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------------- chrome ---------------- */
header{
  display:flex;align-items:center;gap:12px;padding:6px 16px;min-height:50px;flex:0 0 auto;
  /* The mode switcher made this row overflow at narrow widths, pushing the last control off-screen.
     Wrapping keeps every control reachable instead of clipping one. */
  flex-wrap:wrap;row-gap:5px;
  border-bottom:1px solid var(--line);background:linear-gradient(180deg,#101017,#0c0c11);
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;font-size:11.5px;color:var(--tx2)}
.brand .mark{width:22px;height:22px;border-radius:7px;background:var(--ac);display:grid;place-items:center;font-size:11px;color:#fff;letter-spacing:0}
.hstat{display:flex;align-items:center;gap:6px;font:10.5px var(--mono);color:var(--tx3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--tx4);flex:0 0 auto}
.dot.ok{background:var(--ok);box-shadow:0 0 7px rgba(46,224,138,.7)}
.dot.err{background:var(--err);box-shadow:0 0 7px rgba(255,84,112,.6)}
.dot.busy{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.grow{flex:1}
.projsel{background:var(--surf);border:1px solid var(--line2);border-radius:7px;color:var(--tx2);padding:5px 8px;font-size:11.5px;max-width:190px;outline:none}
.projsel:focus{border-color:var(--ac)}

/* ---------------- shell ---------------- */
/* One rail width, driven by a variable, so the narrow-screen rule and the chat-workspace rule cannot
   disagree about it (they did: at 787px the rail stayed 236px wide with every name hidden). */
main{--railw:236px;flex:1;min-height:0;display:grid;grid-template-columns:var(--railw) minmax(0,1fr) 400px;overflow:hidden}
main.nochat{grid-template-columns:var(--railw) minmax(0,1fr) 0px}
main.norail{grid-template-columns:0px minmax(0,1fr) 400px}
main.norail.nochat{grid-template-columns:0px minmax(0,1fr) 0px}

/* ---------------- left rail ---------------- */
#rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.railtop{padding:12px 12px 6px}
.rlabel{font:9.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx4);padding:0 4px 8px}
.agents{overflow-y:auto;min-height:0;flex:1;padding:0 8px 8px}
/* NOTE: these are RAIL rows and must stay scoped to #rail. Chat message rows reuse the
   class name "agent" (.m.agent); an unscoped `.agent` rule leaked overflow:hidden and a
   fixed height onto every agent message, collapsing bubbles to clipped slivers. */
#rail .agent{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r2);cursor:pointer;
  border:1px solid transparent;margin-bottom:3px;position:relative;overflow:hidden;
}
#rail .agent:hover{background:var(--surf)}
#rail .agent.on{background:var(--surf2);border-color:var(--line2)}
#rail .agent.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;border-radius:3px;background:var(--pc,var(--ac))}
.av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:11.5px;color:#fff;flex:0 0 auto;letter-spacing:.02em}
#rail .agent .nm{flex:1;min-width:0}
#rail .agent .nm b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rail .agent .nm span{font:9.5px var(--mono);color:var(--tx4)}
#rail .agent .st{width:14px;display:grid;place-items:center;flex:0 0 auto}
/* Profile rows are recipes, not chats: dimmed, no pointer cursor, no hover lift */
#rail .agent.inert{opacity:.62;cursor:default}
#rail .agent.inert:hover{background:transparent}
.bdg{min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--surf3);color:var(--tx2);font:9.5px var(--mono);display:grid;place-items:center}
.spin{width:11px;height:11px;border:1.5px solid var(--line3);border-top-color:var(--pc,var(--ac));border-radius:50%;animation:sp .75s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.railfoot{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:5px}
.railfoot .b{font-size:11.5px;padding:6px 9px;overflow:hidden;text-overflow:ellipsis}

/* ---------------- buttons ---------------- */
.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:var(--r3);background:var(--surf2);color:var(--tx2);font-size:12px;font-weight:500;border:1px solid var(--line);transition:.14s;white-space:nowrap}
.b:hover{background:var(--surf3);color:var(--tx);border-color:var(--line3)}
.b.pri{background:var(--ac);border-color:transparent;color:#fff}
.b.pri:hover{background:var(--ac2)}
.b.gh{background:transparent}
.b.sm{padding:5px 9px;font-size:11.5px}
.b.icon{padding:6px 8px;font-size:13px}
.b:disabled{opacity:.42;cursor:not-allowed}
.b.wide{width:100%}

/* ---------------- center workspace ---------------- */
#work{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.whead{display:flex;align-items:center;gap:9px;padding:6px 14px;min-height:44px;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bg2);flex-wrap:wrap}
.whead .t{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30vw;flex:0 1 auto}
.whead .sub{font:10px var(--mono);color:var(--tx4);white-space:nowrap}
.modechip{padding:3px 8px;border-radius:5px;background:var(--acsoft);color:var(--ac2);font:9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.pbar{height:2px;background:var(--line);position:relative;overflow:hidden;flex:0 0 2px}
.pbar i{position:absolute;inset:0 100% 0 0;background:linear-gradient(90deg,var(--ac),var(--info));transition:right .3s}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* video mode */
.vwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(circle at 50% 40%,#14141c,#08080b 70%);position:relative;overflow:hidden}
.vwrap video{max-width:100%;max-height:100%;background:#000;box-shadow:var(--shadow)}
.empty{max-width:520px;padding:34px 30px;text-align:center}
.empty h2{font-size:17px;font-weight:650;margin-bottom:7px}
.empty p{color:var(--tx3);font-size:12.5px;line-height:1.75;margin-bottom:20px}
.field{display:flex;gap:7px;margin-bottom:9px}
.fi{flex:1;background:var(--surf);border:1px solid var(--line2);border-radius:var(--r3);padding:9px 12px;color:var(--tx);outline:none;min-width:0}
.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.fi::placeholder{color:var(--tx4)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* timeline / versions */
.tl{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);padding:8px 14px 10px}
.tl .tllabel{font:9.5px var(--mono);letter-spacing:.12em;color:var(--tx4);text-transform:uppercase;margin-bottom:7px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.tlrow{display:flex;gap:7px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:3px}
.chip{
  display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:var(--r3);background:var(--surf);
  border:1px solid var(--line);cursor:pointer;font-size:11.5px;color:var(--tx2);transition:.14s;flex:0 0 auto
}
.chip:hover{border-color:var(--line3);background:var(--surf2)}
.chip.on{border-color:var(--ac);background:var(--acsoft);color:var(--tx)}
.chip .op{font:9.5px var(--mono);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.chip.on .op{color:var(--ac2)}
.chip .du{font:9.5px var(--mono);color:var(--tx4)}

/* search mode */
.sgrid{padding:18px;overflow-y:auto;min-height:0;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));align-content:start}
.cand{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surf);display:flex;flex-direction:column;transition:.16s}
.cand:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:var(--shadow)}
.cand .th{aspect-ratio:4/5;background:#000 center/cover;position:relative;flex:0 0 auto}
.cand .th .pr{position:absolute;bottom:6px;left:6px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.72);font:9.5px var(--mono);color:#fff}
.cand .th .du{position:absolute;bottom:6px;right:6px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.72);font:9.5px var(--mono);color:#fff}
.cand .inf{padding:9px 10px 11px;display:flex;flex-direction:column;gap:7px;flex:1}
.cand .inf b{font-size:11.5px;font-weight:550;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cand .inf .au{font:9.5px var(--mono);color:var(--tx4)}

/* analytics */
.an{padding:18px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:16px}
.ansec{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.ansec h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--tx4);font-weight:600;margin-bottom:12px;font-family:var(--mono)}
.mrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border:none}
.mrow .k{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .v{font:11.5px var(--mono);color:var(--tx2)}
.mrow .v.hi{color:var(--ok)}

/* audio mode */
.audio{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:30px}
.audio .disc{width:118px;height:118px;border-radius:50%;background:conic-gradient(from 0deg,#1d1d28,#2a2a38,#1d1d28);border:1px solid var(--line2);display:grid;place-items:center;font-size:30px}
.audio audio{width:min(420px,80%)}
.audio .lb{font:10px var(--mono);color:var(--tx4);text-align:center;line-height:1.9}

/* ---------------- chat ---------------- */
#chat{border-left:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.chead{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--line);flex:0 0 auto}
.chead b{font-size:12.5px;font-weight:600}
.chead .sub{font:9.5px var(--mono);color:var(--tx4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log{flex:1;min-height:0;overflow-y:auto;padding:13px;display:flex;flex-direction:column;gap:11px}
/* A conversation ROW, not a chat bubble. The assistant's turn is plain prose beside a dim gutter
   marker — wrapping every paragraph in a bubble is noise in a work surface, and it wasted the
   width a long answer needs. The owner's own turn gets a quiet surface block so a multi-line
   instruction still reads as one object. */
.m{width:100%;font-size:13px;line-height:1.72;word-break:break-word;display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;min-width:0;flex:0 0 auto;align-items:start}
/* The gutter marker is drawn, not typed: a text glyph for it is one missing font away from showing
   as an empty box on somebody else's machine. */
.m .gut{display:flex;justify-content:center;padding-top:9px;user-select:none;flex:0 0 auto}
.m .gut i{width:7px;height:7px;border-radius:50%;background:var(--line3);display:block}
.m.user .gut i{background:var(--ac2);border-radius:2px}
.m.agent.err .gut i{background:var(--err)}
.m .col{min-width:0;display:flex;flex-direction:column;align-items:stretch}
.m .bub{white-space:pre-wrap;min-width:0;max-width:100%;color:var(--tx);text-align:start}
.m.user .bub{background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:9px 12px}
.m.agent.err .bub{color:var(--err)}
.m .tm{font:9px var(--mono);color:var(--tx4);margin-top:6px}
.m .art,.m .ops,.m .candrow{max-width:100%;min-width:0}
/* One line per operation: monospace, and it WRAPS. A tool error used to be a single chip that could
   not wrap, so a long provider message ran off the side of the column as a sliver of red text. */
.ops{display:flex;flex-direction:column;gap:2px;margin-top:9px;border-left:1px solid var(--line2);padding-left:10px}
.op{font:11px/1.65 var(--mono);color:var(--tx3);display:flex;gap:7px;align-items:baseline;min-width:0}
.op .ic{flex:0 0 auto;color:var(--tx4)}
.op .nm{flex:0 0 auto;color:var(--tx2);white-space:nowrap}
.op .ex{color:var(--tx4);min-width:0;overflow-wrap:anywhere}
.op.ok .ic{color:var(--ok)}
.op.no .ic,.op.no .nm{color:var(--err)}
/* A failure is stated once, as a sentence, next to the artifact it concerns. The raw provider text
   is one click away instead of dumped into the transcript. */
.fail{border:1px solid rgba(255,84,112,.4);background:rgba(255,84,112,.05);border-radius:8px;padding:9px 11px;margin-top:9px}
.fail .h{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.65;color:var(--tx2)}
.fail .h .ic{color:var(--err);flex:0 0 auto}
.fail summary{font:10px var(--mono);color:var(--tx4);cursor:pointer;margin-top:7px;list-style:none;user-select:none}
.fail summary::-webkit-details-marker{display:none}
.fail summary:hover{color:var(--tx2)}
.fail pre{margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere;font:10.5px/1.6 var(--mono);color:var(--tx3);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 9px;max-height:180px;overflow-y:auto}
/* The empty conversation is a starting point, not a greeting. */
.home{max-width:640px;margin:6vh auto 0;padding:0 2px}
.home h2{font-size:19px;font-weight:650;letter-spacing:-.01em;margin-bottom:8px}
.home p{color:var(--tx3);font-size:12.5px;line-height:1.8;margin-bottom:20px}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.hcard{text-align:start;border:1px solid var(--line2);background:var(--surf);border-radius:10px;padding:11px 13px;cursor:pointer;transition:.14s;display:flex;flex-direction:column;gap:4px}
.hcard:hover{border-color:var(--ac);background:var(--surf2)}
.hcard b{font-size:12.5px;font-weight:600;color:var(--tx)}
.hcard span{font-size:11.5px;line-height:1.55;color:var(--tx4)}
@media(max-width:700px){.hgrid{grid-template-columns:1fr}}
.art{margin-top:9px;border:1px solid var(--line2);border-radius:var(--r2);overflow:hidden;background:var(--bg3);width:100%}
.art video,.art img{width:100%;display:block;background:#000}
.art audio{width:100%;display:block}
.art .bar{display:flex;align-items:center;gap:7px;padding:7px 9px;border-top:1px solid var(--line);flex-wrap:wrap}
.art .bar .nm{font:9.5px var(--mono);color:var(--tx3);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.candrow{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}
.candrow .c{flex:0 0 104px;border:1px solid var(--line2);border-radius:7px;overflow:hidden;cursor:pointer;background:var(--bg3)}
.candrow .c:hover{border-color:var(--ac)}
.candrow .c .th{aspect-ratio:4/5;background:#000 center/cover;position:relative}
.candrow .c .cp{padding:4px 5px;font:9px var(--mono);color:var(--tx4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* artifact card: real media + real actions, never built from a model's claim */
.art .bar .op{font:9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ac2);background:var(--acsoft);padding:2px 6px;border-radius:4px;flex:0 0 auto}
.art .acts{display:flex;gap:5px;padding:7px 9px;border-top:1px solid var(--line);flex-wrap:wrap}
.art .acts button,.art .acts a{font-size:10.5px;padding:4px 8px;border-radius:5px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);text-decoration:none;cursor:pointer;white-space:nowrap}
.art .acts button:hover,.art .acts a:hover{border-color:var(--ac);color:var(--tx)}
.art .acts .warnish{border-color:rgba(255,84,112,.4);color:var(--err)}
.art .meta{display:flex;gap:8px;flex-wrap:wrap;padding:0 9px 7px;font:9.5px var(--mono);color:var(--tx4)}
.art.missing{border-color:rgba(255,84,112,.4)}
.art.missing .warn{padding:9px;font:10.5px var(--mono);color:var(--err)}

/* approval checkpoint inside the log */
.appr{margin-top:9px;border:1px solid rgba(255,179,64,.42);background:rgba(255,179,64,.07);border-radius:var(--r2);padding:9px 10px;max-width:280px}
.appr .t{font-size:11.5px;font-weight:600;color:var(--warn);display:flex;align-items:center;gap:6px;margin-bottom:7px}
.appr .s{font:9.5px var(--mono);color:var(--tx4);margin-bottom:8px;line-height:1.7}
.appr .r{display:flex;gap:5px;flex-wrap:wrap}
.appr .r button{font-size:10.5px;padding:5px 9px;border-radius:5px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer}
.appr .r button.pri{background:var(--ok);border-color:transparent;color:#04120b;font-weight:600}
.appr .r button:hover{filter:brightness(1.15)}
.appr.done{border-color:var(--line);background:transparent}
.appr.done .t{color:var(--tx3)}

/* sticky pending-approval banner above the composer */
.pendbar{display:none;align-items:center;gap:8px;padding:7px 9px;margin-bottom:7px;border:1px solid rgba(255,179,64,.42);background:rgba(255,179,64,.08);border-radius:var(--r2);font-size:11.5px;color:var(--warn)}
.pendbar.on{display:flex}
.pendbar .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pendbar button{font-size:10.5px;padding:4px 9px;border-radius:5px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);cursor:pointer}
.pendbar button.pri{background:var(--ok);border-color:transparent;color:#04120b;font-weight:600}

/* agent activity — operational facts only (which task, which model, how long, which tool).
   No chain-of-thought is ever captured, so none can be shown. */
.actwrap{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2)}
.actbar{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:11.5px;color:var(--tx2);cursor:pointer;user-select:none}
.actbar:hover{background:var(--surf)}
.actbar .spin2{width:10px;height:10px;border:1.5px solid var(--line3);border-top-color:var(--ac);border-radius:50%;animation:sp .75s linear infinite;flex:0 0 auto}
.actbar .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actbar .c{font:9.5px var(--mono);color:var(--tx4);flex:0 0 auto}
.actbar .cv{font:9px var(--mono);color:var(--tx4);flex:0 0 auto;transition:.15s}
.actbar.open .cv{transform:rotate(180deg)}
.actbody{display:none;max-height:min(214px,32vh);overflow-y:auto;padding:0 12px 10px;border-top:1px solid var(--line)}
.actbody.on{display:block}
.actrow{display:flex;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.5}
.actrow:last-child{border-bottom:none}
.actrow .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.actrow .m{font:9.5px var(--mono);color:var(--tx4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44%}
.actrow .d{font:9.5px var(--mono);color:var(--tx4);flex:0 0 auto}
.actrow.bad .l{color:var(--err)}
.actrow.good .m{color:var(--ok)}
.actrow.job .l{color:var(--tx3)}

/* settings */
.stabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:2px}
.stabs button{font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surf);color:var(--tx3);cursor:pointer}
.stabs button.on{border-color:var(--ac);background:var(--acsoft);color:var(--tx)}
.srow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r3);background:var(--surf);font-size:11.5px}
.srow .k{flex:1;min-width:0;overflow:hidden}
.srow .k b{display:block;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .k span{font:9.5px var(--mono);color:var(--tx4)}
.hpill{font:9px var(--mono);padding:2px 7px;border-radius:4px;border:1px solid var(--line2);color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;flex:0 0 auto}
.hpill.ready{color:var(--ok);border-color:rgba(46,224,138,.4)}
.hpill.rate_limited{color:var(--warn);border-color:rgba(255,179,64,.4)}
.hpill.error{color:var(--err);border-color:rgba(255,84,112,.4)}
.hpill.disabled{color:var(--tx4)}
.hpill.unknown{color:var(--tx3)}
.trow{display:flex;align-items:center;gap:6px;font:10px var(--mono);color:var(--tx3);padding:3px 0;flex-wrap:wrap}
.trow .tk{color:var(--tx4);width:74px;flex:0 0 auto}
.trow .mid{border:1px solid var(--line2);border-radius:4px;padding:1px 6px;color:var(--tx2)}
.trow .mid.first{border-color:rgba(79,124,255,.5);color:var(--ac2)}
.testout{font:10.5px var(--mono);padding:8px 10px;border-radius:6px;border:1px solid var(--line2);background:var(--bg3);line-height:1.75;white-space:pre-wrap;word-break:break-word}
.testout.ok{border-color:rgba(46,224,138,.4);color:var(--ok)}
.testout.no{border-color:rgba(255,84,112,.4);color:var(--err)}

.composer{border-top:1px solid var(--line);padding:9px 10px 10px;flex:0 0 auto;background:var(--bg2)}
.crow{display:flex;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.cin{display:flex;gap:7px}
.cin textarea{
  flex:1;background:var(--surf);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;
  color:var(--tx);resize:none;height:auto;min-height:44px;max-height:180px;overflow-y:auto;outline:none;font-size:12.5px;line-height:1.55
}
/* The two shortcuts worth knowing, stated where the cursor is rather than in a help page. */
.chint{display:flex;gap:12px;align-items:center;padding:6px 3px 0;font:9.5px var(--mono);color:var(--tx4)}
.chint .grow{flex:1}
.chint kbd{font:inherit;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:var(--tx3)}
.cin textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acsoft)}
.cin textarea::placeholder{color:var(--tx4)}

/* ---------------- modal ---------------- */
.ov{position:fixed;inset:0;background:rgba(4,4,7,.72);backdrop-filter:blur(4px);z-index:60;display:grid;place-items:center;padding:24px}
.modal{background:var(--bg3);border:1px solid var(--line2);border-radius:15px;box-shadow:var(--shadow);width:min(660px,94vw);max-height:88dvh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh b{font-size:14px}
.mb{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:9.5px var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--tx4)}
.fld input,.fld select,.fld textarea{background:var(--surf);border:1px solid var(--line2);border-radius:var(--r3);padding:8px 10px;color:var(--tx);outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--ac)}
.fld textarea{resize:vertical;min-height:66px;font-size:12.5px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rules{display:flex;flex-direction:column;gap:6px}
.rule{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;background:var(--surf);border:1px solid var(--line);border-radius:var(--r3);font-size:12px;color:var(--tx2)}
.rule span{flex:1}
.job{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r3);background:var(--surf);font-size:11.5px;color:var(--tx2)}
.job .ty{font:9.5px var(--mono);color:var(--tx4)}
.job.err{border-color:rgba(255,84,112,.35)}
.act{display:flex;flex-direction:column;gap:4px;max-height:210px;overflow-y:auto;font:10.5px var(--mono);color:var(--tx3)}
.act div{display:flex;gap:8px}
.act .ts{color:var(--tx4);flex:0 0 auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surf3);border:1px solid var(--line3);
  padding:9px 16px;border-radius:9px;font-size:12px;z-index:90;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;bottom:26px}
.toast.err{border-color:var(--err)}
.hint{font:10.5px var(--mono);color:var(--tx4)}
@media(max-width:1200px){main{grid-template-columns:198px minmax(0,1fr) 344px}.whead .t{max-width:24vw}}
@media(max-width:1040px){main{grid-template-columns:178px minmax(0,1fr) 322px}.whead .t{max-width:22vw}.whead .sub{display:none}.b.sm{padding:5px 8px}}
@media(max-width:1240px){.whead .lbl{display:none}.whead .b.sm{padding:6px 9px}}
@media(max-width:900px){main{--railw:62px;grid-template-columns:var(--railw) minmax(0,1fr) 320px}#rail .agent .nm,#rail .agent .st,.railfoot .b,.railfoot .lbl,.rlabel{display:none}#rail .agent{justify-content:center;padding:8px 4px}}

/* ==================================================================================
   EDITOR SURFACES — timeline, transcript, captions, version tree, drawer, inspector,
   command palette and the caption canvas. Everything here is driven by real project
   records from /api/v2; there are no decorative or mock elements.
   ================================================================================== */
.oc{display:flex;gap:2px;border:1px solid var(--line2);border-radius:var(--r3);overflow:hidden;flex:0 0 auto}
.oc .b{border:none;border-radius:0;padding:4px 9px;font:10px var(--mono);letter-spacing:.06em}
.oc .b.on{background:var(--ac);color:#fff}
.badge{font:9px var(--mono);color:var(--tx4);margin-left:2px}
.badge.on{color:var(--warn);font-weight:600}

/* ---- timeline ---- */
.tl{flex:0 0 auto;border-top:1px solid var(--line);background:var(--bg2);padding:0;display:flex;flex-direction:column}
.tltools{display:flex;align-items:center;gap:10px;padding:5px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.tnow{font:11.5px var(--mono);color:var(--tx);min-width:56px}
.tltools .hint{font:9.5px var(--mono);color:var(--tx4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}
.tlc{overflow-x:auto;overflow-y:hidden;padding:0 14px 9px;min-height:126px}
.tlInner{position:relative;padding-top:3px}
.tlruler{position:relative;height:17px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.tlruler i{position:absolute;top:0;bottom:0;width:1px;background:var(--line2)}
.tlruler span{position:absolute;top:2px;font:9px var(--mono);color:var(--tx4);transform:translateX(3px)}
.trk{display:flex;align-items:center;gap:9px;height:23px;margin-bottom:3px}
.trk .tname{flex:0 0 66px;font:9px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--tx4);text-align:right;overflow:hidden;white-space:nowrap}
.trk .lane{position:relative;height:19px;border-radius:4px;background:rgba(255,255,255,.022)}
.blk{position:absolute;top:0;bottom:0;border-radius:4px;border:1px solid;overflow:hidden;cursor:pointer;font:9.5px var(--mono);display:flex;align-items:center;padding:0 5px;white-space:nowrap}
.blk.sel{outline:1.5px solid var(--tx);outline-offset:1px}
.blk.on{filter:brightness(1.4)}
.lane.l-video .blk{background:rgba(79,124,255,.2);border-color:rgba(79,124,255,.45);color:var(--ac2)}
.lane.l-audio .blk{background:rgba(76,201,240,.16);border-color:rgba(76,201,240,.4);color:#9fe4ff}
.lane.l-tts .blk{background:rgba(46,224,138,.16);border-color:rgba(46,224,138,.4);color:#93f2c6}
.lane.l-music .blk{background:rgba(198,107,255,.16);border-color:rgba(198,107,255,.4);color:#e0b6ff}
.lane.l-captions .blk{background:rgba(255,179,64,.15);border-color:rgba(255,179,64,.42);color:#ffd79a}
.lane.l-text .blk{background:rgba(255,255,255,.07);border-color:var(--line3);color:var(--tx2)}
.lanehint{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:9px var(--mono);color:var(--tx4);white-space:nowrap;pointer-events:none}
.ph{position:absolute;top:0;bottom:0;width:1.5px;background:var(--err);z-index:4;pointer-events:none}
.ph:before{content:'';position:absolute;top:-5px;left:-3.5px;width:8px;height:8px;background:var(--err);border-radius:2px}

/* ---- bottom drawer ---- */
.drawer{flex:0 0 auto;height:238px;min-height:120px;border-top:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column}
.dtabs{display:flex;align-items:center;gap:2px;padding:4px 12px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.dtab{font-size:11.5px;color:var(--tx3);padding:6px 10px;border-bottom:2px solid transparent;background:none;border-radius:0;white-space:nowrap}
.dtab:hover{color:var(--tx2)}
.dtab.on{color:var(--tx);border-bottom-color:var(--ac)}
.dtabs .hint{font:9.5px var(--mono);color:var(--tx4);padding-right:2px}
.dcol{font-size:12px;line-height:1;color:var(--tx3);background:none;padding:5px 7px;border-radius:5px}
.dcol:hover{color:var(--tx);background:rgba(255,255,255,.05)}
.dpanel{flex:1;min-height:0;overflow-y:auto;padding:10px 14px}
.drawer.min{height:auto;min-height:0}
.drawer.min .dpanel{display:none}
.dhd{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
.dhd .grow{flex:1}
.tsrc{font:9.5px var(--mono);color:var(--tx4)}
.corr{font:9px var(--mono);color:var(--warn);margin-left:5px}

/* transcript + caption rows */
.tseg,.cseg{display:flex;gap:10px;padding:5px 8px;border-radius:6px;align-items:flex-start}
.tseg{cursor:pointer}
.tseg:hover,.cseg:hover{background:var(--surf)}
.tseg.on{background:var(--acsoft)}
.cseg{border-bottom:1px solid var(--line)}
.cseg.on{background:rgba(255,179,64,.08)}
.tseg .tm,.cseg .tm{font:9.5px var(--mono);color:var(--tx4);flex:0 0 82px;padding-top:3px}
.tseg .tx,.cseg .tx{flex:1;font-size:12.5px;line-height:1.6;min-width:0;text-align:start}
.cseg .cn{font:9.5px var(--mono);color:var(--tx4);flex:0 0 30px;padding-top:3px}
.cseg .rr{display:flex;gap:5px;flex:0 0 auto}
.cseg .rr button{font-size:10px;padding:3px 7px;border-radius:5px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2)}
.cseg .rr button:hover{border-color:var(--ac);color:var(--tx)}
.tseg .ed,.cseg .ed{flex:1;min-width:0}

/* version tree */
.vnode{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:6px;font-size:11.5px;cursor:pointer}
.vnode:hover{background:var(--surf)}
.vnode.cur{background:var(--acsoft)}
.vnode .br{font:10px var(--mono);color:var(--tx4);flex:0 0 20px}
.vnode .num{font:9.5px var(--mono);color:var(--tx4);flex:0 0 30px}
.vnode .op{font:9.5px var(--mono);color:var(--tx3);text-transform:uppercase;flex:0 0 76px}
.vnode .lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vnode .time{font:9.5px var(--mono);color:var(--tx4)}

/* artifact drawer */
.dgrp{margin-bottom:13px}
.dgrp h4{font:9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx4);margin-bottom:6px}
.dgitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:7px}
.ditem{border:1px solid var(--line2);border-radius:7px;background:var(--surf);overflow:hidden;cursor:pointer}
.ditem:hover{border-color:var(--ac)}
.ditem.cur{border-color:var(--ac);box-shadow:0 0 0 2px var(--acsoft)}
.ditem .thumb{aspect-ratio:9/16;background:#000 center/cover;display:grid;place-items:center;color:var(--tx4);font:10px var(--mono)}
.ditem .m{padding:5px 7px;font:9.5px var(--mono);color:var(--tx4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* suggestions */
.sug{border:1px solid var(--line2);background:var(--surf);border-radius:var(--r2);padding:9px 11px;margin-bottom:8px}
.sug.warn{border-color:rgba(255,179,64,.42)}
.sug .h{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.sug .h b{font-size:12.5px;font-weight:600}
.sug .sev{font:9px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--surf3);color:var(--tx4)}
.sug.warn .sev{background:rgba(255,179,64,.14);color:var(--warn)}
.sug .d{font-size:11.5px;color:var(--tx2);line-height:1.65;margin-bottom:6px}
.sug .ev{font:9.5px var(--mono);color:var(--tx4);margin-bottom:8px;line-height:1.6}
.sug .r{display:flex;gap:6px;flex-wrap:wrap}
.sug .r button{font-size:10.5px;padding:4px 9px;border-radius:5px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx2)}
.sug .r button:hover{border-color:var(--ac);color:var(--tx)}
.sug .r button.pri{background:var(--ac);border-color:transparent;color:#fff}

/* ---- right panel: agent | inspector ---- */
.rtabs{display:flex;gap:2px;padding:5px 10px 0;border-bottom:1px solid var(--line);flex:0 0 auto}
.rtab{font-size:11.5px;color:var(--tx3);padding:5px 10px;border-bottom:2px solid transparent;border-radius:0}
.rtab:hover{color:var(--tx2)}
.rtab.on{color:var(--tx);border-bottom-color:var(--ac)}
.rpane{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
#inspector{overflow-y:auto;padding:12px 13px}
.inssec{margin-bottom:15px}
.inssec h4{font:9.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tx4);margin-bottom:8px;display:flex;align-items:center;gap:7px}
.inssec h4 .grow{flex:1}
.irow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.irow label{flex:0 0 86px;font-size:11px;color:var(--tx3);overflow:hidden;white-space:nowrap}
.iin{flex:1;min-width:0;background:var(--surf);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;color:var(--tx);font-size:11.5px;outline:none}
.iin:focus{border-color:var(--ac)}
textarea.iin{resize:vertical;min-height:56px;line-height:1.6}
.ibtn{font-size:10.5px;padding:5px 9px;border-radius:5px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx2)}
.ibtn:hover{border-color:var(--ac);color:var(--tx)}
.ibtn.pri{background:var(--ac);border-color:transparent;color:#fff}
.ibtn.ok{background:var(--ok);border-color:transparent;color:#04120b;font-weight:600}
.ibtn:disabled{opacity:.4;cursor:not-allowed}
.kv{display:flex;justify-content:space-between;gap:8px;font:10px var(--mono);color:var(--tx4);padding:2px 0}
.kv b{color:var(--tx3);font-weight:500;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.mono{font:9.5px var(--mono);color:var(--tx4);line-height:1.7}

/* ---- caption canvas over the video ---- */
.vwrap{position:relative}
.cvbox{position:absolute;pointer-events:none;z-index:5}
.cvbox .safe{position:absolute;left:0;right:0;border:1px dashed rgba(255,179,64,.45);pointer-events:none}
.cvbox .safe.top{top:12%}
.cvbox .safe.bot{bottom:14%}
.cvotext{position:absolute;left:50%;transform:translateX(-50%);pointer-events:auto;cursor:move;padding:2px 7px;border-radius:4px;font-weight:700;color:#fff;text-shadow:0 2px 4px #000,0 0 2px #000;background:rgba(0,0,0,.3);max-width:88%;text-align:center;border:1px dashed transparent;white-space:pre-wrap}
.cvotext:hover{border-color:var(--ac2)}
.cvotext.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--acsoft)}
.cvhint{position:absolute;left:8px;bottom:6px;font:9px var(--mono);color:rgba(255,255,255,.55);pointer-events:none}

/* ---- command palette ---- */
.palette{position:fixed;inset:0;background:rgba(4,4,8,.6);backdrop-filter:blur(3px);display:none;z-index:70;padding-top:11vh;justify-content:center;align-items:flex-start}
.palette.on{display:flex}
.pbox{width:min(570px,92vw);background:var(--bg3);border:1px solid var(--line3);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;max-height:70vh}
.pinput{background:transparent;border:none;border-bottom:1px solid var(--line);padding:14px 16px;font-size:14px;color:var(--tx);outline:none}
.plist{overflow-y:auto;padding:6px}
.pitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:12.5px;color:var(--tx2)}
.pitem:hover,.pitem.on{background:var(--surf2);color:var(--tx)}
.pitem .k{font:9.5px var(--mono);color:var(--tx4);margin-left:auto;white-space:nowrap}

/* ---- lock bar + role chip ---- */
/* One compact row that scrolls sideways. Wrapping nine chips onto three rows ate 100px of the
   preview at narrow widths, which is the wrong trade for a control you glance at. */
.lockbar{display:flex;align-items:center;gap:8px;padding:3px 10px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto}
.lockbar .lbl2{font:600 9px var(--sans);color:var(--tx4);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
.rolechip{font:600 9.5px var(--mono);padding:3px 7px;border-radius:5px;border:1px solid var(--line2);color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.rolechip.master{border-color:rgba(79,124,255,.5);color:var(--ac2)}
.rolechip.branch{border-color:rgba(76,201,240,.45);color:var(--info)}
.rolechip.approved{border-color:rgba(46,224,138,.45);color:var(--ok)}
.rolechip.draft{border-color:rgba(255,179,64,.45);color:var(--warn)}
/* ---- modes (CREATE / REVIEW / PERFORMANCE) ---- */
.modes{display:flex;gap:1px;background:var(--surf2);border:1px solid var(--line2);border-radius:8px;padding:2px}
.modes button{background:transparent;border:none;color:var(--tx3);font:600 11.5px var(--sans);padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:.02em}
.modes button:hover{color:var(--tx2)}
.modes button.on{background:var(--surf3);color:var(--tx)}
.modes .cnt{font:9.5px var(--mono);color:var(--warn);margin-left:5px}
/* a full-screen mode view (review / performance) — overlays the studio, does not restructure it */
.view{position:fixed;left:0;right:0;bottom:0;top:var(--hdr,50px);background:var(--bg);z-index:40;display:none;flex-direction:column}
.view.on{display:flex}
.vhead{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg2);flex:0 0 auto;flex-wrap:wrap}
.vhead h2{font:600 14px var(--sans);letter-spacing:-.01em;margin:0}
.vhead .grow{flex:1}
/* REVIEW is a decision screen: the queue and the decision panel each scroll on their own, so the
   approve/fix/regenerate row can never be pushed below the fold by a tall video. */
.vbody{flex:1;overflow:hidden;padding:14px 16px;display:grid;gap:14px;grid-template-columns:288px 1fr;align-items:stretch;min-height:0}
.vbody.single{grid-template-columns:1fr;overflow-y:auto;align-content:start}
.rvcol{display:flex;flex-direction:column;gap:9px;min-height:0;overflow-y:auto}
.rbig .player{max-height:min(46dvh,420px)}
.rbig video{max-height:min(46dvh,420px)}
@media(max-width:880px){.vbody{grid-template-columns:206px 1fr}}
.rcap{font:600 10px var(--sans);color:var(--tx4);text-transform:uppercase;letter-spacing:.08em;padding:2px 0 4px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:12px}
.bcard{background:var(--surf);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.bcard.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--acsoft)}
.bcard .bt{display:flex;align-items:center;gap:7px;padding:8px 10px;border-bottom:1px solid var(--line)}
.bcard .bt b{font:600 11.5px var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bcard .bt .st{font:9.5px var(--mono);color:var(--tx4);margin-left:auto;white-space:nowrap}
.bcard video,.bcard img{width:100%;aspect-ratio:9/16;object-fit:contain;background:#000;display:block}
.bcard .bm{padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-height:56px}
.bcard .bm .meta{font:10px var(--mono);color:var(--tx4)}
.bcard .acts{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 10px}
.bskip{font:10px/1.45 var(--mono);color:var(--tx4);border-left:2px solid var(--line2);padding-left:7px;margin-top:2px}
/* status pills */
.pill{font:600 9.5px var(--mono);padding:2px 6px;border-radius:20px;border:1px solid var(--line2);color:var(--tx3);text-transform:uppercase;letter-spacing:.04em}
.pill.waiting{color:var(--warn);border-color:rgba(255,179,64,.4)}
.pill.approved{color:var(--ok);border-color:rgba(46,224,138,.4)}
.pill.fix_requested{color:var(--info);border-color:rgba(76,201,240,.4)}
.pill.regenerating{color:var(--ac2);border-color:rgba(143,131,255,.4)}
.pill.rejected,.pill.failed{color:var(--err);border-color:rgba(255,84,112,.4)}
.pill.done{color:var(--tx3)}
/* review rows */
.rrows{display:flex;flex-direction:column;gap:5px}
.rrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);cursor:pointer}
.rrow:hover{border-color:var(--line3)}
.rrow.on{border-color:var(--ac);background:var(--acsoft)}
.rrow .t{font:12px var(--sans);color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .grow{flex:1}
.rbig{display:grid;grid-template-columns:1fr 268px;gap:14px;align-items:start}
.rbig .player{background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center}
.rbig video{max-width:100%;max-height:60dvh;display:block}
.ractions{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 0}
/* diff / plan */
.drow{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.drow .lbl{font:600 10.5px var(--sans);color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.drow .vals{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--tx2)}
.drow .from{color:var(--tx4);text-decoration:line-through;text-decoration-color:var(--tx4)}
.drow .to{color:var(--tx)}
.drow.held .to{color:var(--tx4);font-style:italic}
.drow.blk{border-left:2px solid var(--err);padding-left:8px;margin-left:-10px}
.dchk{display:flex;align-items:flex-start;gap:8px}
.dchk input{margin-top:2px}
.dchk.dis .vals{opacity:.45}
/* locks */
.locks{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;min-width:0}
.lk{display:flex;align-items:center;gap:3px;padding:2px 6px;border:1px solid var(--line2);border-radius:5px;background:transparent;color:var(--tx4);font:10.5px var(--sans);cursor:pointer;white-space:nowrap;flex:0 0 auto}
.lk:hover{color:var(--tx2);border-color:var(--line3)}
.lk.on{background:var(--surf3);border-color:var(--warn);color:var(--warn)}
.lk.on.inh{border-color:var(--ac2);color:var(--ac2)}
/* performance */
.prow{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
.prow .k{font:12px var(--sans);color:var(--tx2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .v{font:600 11.5px var(--mono);color:var(--tx)}
.ibox{border:1px solid var(--line);border-left:3px solid var(--ac);border-radius:8px;background:var(--surf);padding:10px 12px}
.ibox .h{font:600 12px var(--sans);color:var(--tx);margin-bottom:3px}
.ibox .d{font:11.5px/1.5 var(--sans);color:var(--tx2)}
.ibox .e{font:10px/1.5 var(--mono);color:var(--tx4);margin-top:6px}
.ibox.warn{border-left-color:var(--warn)}
.ibox.info{border-left-color:var(--info)}
@media(max-width:1100px){.drawer{height:206px}.tltools .hint{display:none}}
@media(max-width:900px){.rbig{grid-template-columns:1fr}}

/* ============ artifact-first workspace ============ */
/* The center of the product is the artifact, so artifacts get real size and real controls.
   These are the surfaces the owner judges footage on — not attachment thumbnails. */
.m .art{max-width:100%}
.art.big video{max-height:min(58vh,520px);object-fit:contain;background:#000}
.art .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--bg3)}
.art .hd b{font:600 12px var(--sans);color:var(--tx);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art .hd .sp{flex:1}
.art .sub{padding:0 10px 8px;font:11px var(--sans);color:var(--tx3)}
.art .acts button.primary{background:var(--ac);border-color:var(--ac);color:#fff}
.art{cursor:pointer;transition:border-color .15s,box-shadow .15s}
.art.focused{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
/* candidate cards: judgeable at a glance, with the measured facts and the reason it matched */
.sgrid{padding:14px;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.sgrid .cand{flex:none}
/* Candidate cards are LIST ROWS, not tiles: the centre column is narrow, and a vertical 9:16 tile
   either goes one-per-row or gets squashed. A fixed-height frame beside the details gives a real
   playable preview with no dependence on intrinsic sizing (a video sized by aspect-ratio inside a
   percentage-width box contributes no height, which collapsed these cards to ~30px before). */
.cand{display:grid;grid-template-columns:118px minmax(0,1fr)}
.cand .th{height:210px;width:100%;aspect-ratio:auto;position:relative;overflow:hidden;flex:none}
.cand .th video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
.cand .inf{min-width:0}
.cand .inf b{-webkit-line-clamp:3}
.cand .sig{display:flex;flex-wrap:wrap;gap:4px;padding:0 10px}
.sig span{font:9px var(--mono);padding:2px 5px;border-radius:4px;border:1px solid var(--line2);color:var(--tx4)}
.sig span.yes{border-color:var(--ok);color:var(--ok)}
.sig span.no{border-color:var(--err);color:var(--err)}
.sig span.unk{opacity:.6}
.cand .why{padding:0 10px 4px;font:10.5px/1.45 var(--sans);color:var(--tx3);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cand .why b{color:var(--tx2);font-weight:600}
.cand .ibar{padding:6px 10px 10px;display:flex;flex-direction:column;gap:5px}
.cand .ibar .st{font:10px var(--mono);color:var(--tx3);min-height:13px}
.cand .ibar .st.err{color:var(--err)}
.cand.importing{opacity:.7}
.cand.imported{border-color:var(--ok)}
/* the search header explains what was understood and what was not checked */
.shead{padding:12px 16px 0;display:flex;flex-direction:column;gap:7px}
.shead .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.shead .tag{font:10px var(--mono);padding:3px 7px;border-radius:5px;background:var(--surf2);border:1px solid var(--line2);color:var(--tx3)}
.shead .tag.on{border-color:var(--ac);color:var(--ac2)}
.shead .note{font:11px/1.5 var(--sans);color:var(--tx4)}
/* publishing: the confirmation the owner actually sees before anything becomes public */
.pub{display:flex;flex-direction:column;gap:9px}
.pub .pair{border:1px solid var(--line2);border-radius:8px;padding:9px 11px;background:var(--surf);display:flex;flex-direction:column;gap:3px}
.pub .pair .t{font:600 12px var(--sans);color:var(--tx)}
.pub .pair .d{font:11px var(--mono);color:var(--tx3)}
.pub .pair.bad{border-color:var(--err)}
.pub .pair.bad .t{color:var(--err)}
.pub .opts{display:flex;flex-direction:column;gap:5px}
.pub .opt{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line2);border-radius:7px;cursor:pointer}
.pub .opt:hover{border-color:var(--ac)}
.pub .opt input{margin:0}
.pub .opt .nm{font:12px var(--sans);color:var(--tx2);flex:1}
.pub .opt.off{opacity:.5;cursor:not-allowed}
/* the orchestrator is the home: it reads as the studio itself, not as an eighth page */
.agent.orch{border-bottom:1px solid var(--line2);margin-bottom:4px;padding-bottom:8px}
.agent.orch .av{background:#4f7cff}
.agent.orch .nm b{letter-spacing:.02em}
/* A result set takes the workspace: the timeline and drawer are for an open cut, not for choosing
   footage, and leaving them up squeezed the candidates into a strip. */
#work.transient #tlWrap,#work.transient #drawerWrap{display:none}

/* ============ CHAT-FIRST WORKSPACE (the default) ============ */
/* The product is a conversation with artifacts. The editor (timeline, inspector, tracks) is a real
   screen but a SECONDARY one — it is one click away, not what you land on. In chat mode the
   conversation takes the whole centre column and is centred at a readable measure, the way a task
   workspace should read; no timeline, no drawer, no tabs competing for attention. */
/* main is a GRID (rail | work | chat), so the chat column only grows if the track list changes. */
body[data-ui="chat"] main{grid-template-columns:var(--railw) minmax(0,1fr) 0}
body[data-ui="chat"] main.norail{grid-template-columns:0 minmax(0,1fr) 0}
body[data-ui="chat"] #work{display:none}
body[data-ui="chat"] #chat{width:auto;max-width:none;border-left:none}
body[data-ui="chat"] .rtabs{display:none}
body[data-ui="chat"] #inspector{display:none!important}
body[data-ui="chat"] .log{padding:26px 24px 13px;gap:16px}
body[data-ui="chat"] .log,body[data-ui="chat"] .actwrap,body[data-ui="chat"] .composer{max-width:880px;width:100%;margin-left:auto;margin-right:auto}
body[data-ui="chat"] .composer{border-top:none;padding:6px 24px 20px}
body[data-ui="chat"] .actwrap{border-top:1px solid var(--line);max-width:832px}
body[data-ui="chat"] .m .bub{font-size:13.5px;line-height:1.75}
body[data-ui="chat"] .m{font-size:13.5px}
/* The chat is for decisions and output, not a raw execution trace.  A compact status appears only
   while a job needs the owner's attention; detailed activity remains available in Advanced. */
body[data-ui="chat"] .m .ops{display:none}
body[data-ui="chat"] .actwrap.is-quiet{display:none}
body[data-ui="chat"] .actbar{cursor:default;padding:8px 2px;color:var(--tx3);font:500 11.5px var(--sans)}
body[data-ui="chat"] .actbar .cv,body[data-ui="chat"] .actbar .c{display:none}
body[data-ui="chat"] .actbody{display:none!important}
/* Artifacts are the point of the conversation: full width of the column, never a 280px thumbnail. */
body[data-ui="chat"] .m .art,body[data-ui="chat"] .m .candrow,body[data-ui="chat"] .m .candlist{max-width:100%}
body[data-ui="chat"] .m .art{margin-top:12px}
/* A 9:16 clip in a wide column used to letterbox inside a full-width frame, which reads as a huge
   black card. The element now takes its own aspect and centres, so the artifact is big without the
   empty bars. */
body[data-ui="chat"] .art.big video{width:auto;max-width:100%;max-height:min(58vh,560px);margin:0 auto;display:block;background:#000}
.candlist{display:flex;flex-direction:column;gap:10px;padding:8px 0 2px}
.chathdr{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--line);flex:0 0 auto}
.chathdr .t{font:600 13px var(--sans);color:var(--tx)}
.chathdr .s{font:10.5px var(--mono);color:var(--tx4)}
body[data-ui="chat"] .chathdr{max-width:880px;margin:0 auto;width:100%;border-bottom:none;padding:16px 24px 6px}
.modes .mdiv{width:1px;background:var(--line2);margin:3px 4px;align-self:stretch}
/* Keep the header to ONE row on narrow screens: labels drop, icons and tooltips stay. A wrapped
   header cost 40px of vertical space and pushed the workspace down on every view. */
header{flex-wrap:nowrap}
.hbtn .hlbl{margin-left:5px}
@media(max-width:1250px){.hbtn .hlbl{display:none}.hstat{display:none}}
@media(max-width:900px){.brand span:not(.mark){display:none}.modes button{padding:5px 9px}}

/* ==================================================================================
   SHELL v3 — one orchestrator workspace, and artifact-first presentation.

   What changed and why:
     · the header showed four "apps" (Chat/Editor/Review/Performance) plus a server LED and a model
       LED. That is developer telemetry competing with the owner's context. It is now context
       (who this conversation is, which project is open) plus the two actions that are always
       relevant: Review when something needs a decision, and Advanced for everything else.
     · the left rail listed seven page agents, so the owner had to pick an agent before saying what
       they wanted. It now lists the owner's own history and library. Page agents are backend
       workers and are configured in Settings.
     · blue is a restrained accent for the primary action, the selected row and focus — not the
       background of every chip, pill and badge.
     · `--sans` was referenced by the old mode switch but never defined, so those `font:` shorthands
       were invalid and silently dropped. Defined here.
   ================================================================================== */
:root{
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --hdr:52px;
  --r:10px; --r2:8px; --r3:7px;
  --sel:rgba(255,255,255,.05);
  --acsoft:rgba(79,124,255,.12);
}

/* ---- top bar ---- */
header{min-height:var(--hdr);padding:0 14px;gap:14px;flex-wrap:nowrap;background:var(--bg2);background-image:none}
.brand{font:600 13.5px var(--sans);letter-spacing:0;color:var(--tx);cursor:pointer;gap:8px}
.brand .mark{width:20px;height:20px;border-radius:6px;font-size:0;background:var(--ac);box-shadow:none}
.ctx{display:flex;align-items:center;gap:9px;min-width:0;padding-left:14px;border-left:1px solid var(--line)}
.ctxwho{font:600 12.5px var(--sans);color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.projsel{max-width:230px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;border:1px solid var(--line2);background:transparent;color:var(--tx2);font:500 12px var(--sans);white-space:nowrap}
.tbtn:hover{border-color:var(--line3);color:var(--tx);background:var(--surf)}
.tbtn .cnt{font:600 9.5px var(--mono);color:var(--warn)}
.tbtn .cv{font:9px var(--mono);color:var(--tx4)}
/* A connection light that is only visible when something is wrong: no LED is good news. */
.conndot{display:none}
.conndot.bad{background:var(--err);box-shadow:0 0 6px rgba(255,84,112,.6)}
.advmenu{position:fixed;top:calc(var(--hdr) + 4px);right:12px;z-index:80;min-width:266px;background:var(--bg3);border:1px solid var(--line3);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:none}
.advmenu.on{display:block}
.advmenu button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;padding:7px 10px;border-radius:7px;color:var(--tx2);font:500 12.5px var(--sans)}
.advmenu button:hover{background:var(--surf2);color:var(--tx)}
.advmenu button span{font:10.5px var(--sans);color:var(--tx4)}
.advmenu .sep{height:1px;background:var(--line);margin:5px 6px}
/* Settings task cards: one row per backend role, chain shown as ordered pills */
.taskcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.taskcard .chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
details.recipe summary{cursor:pointer;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
details.recipe[open] summary{margin-bottom:6px}

/* ---- left rail: history + library ---- */
.railtop{padding:10px 10px 6px}
.newtask{width:100%;text-align:start;padding:8px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--surf);color:var(--tx);font:500 12.5px var(--sans);display:flex;align-items:center;gap:8px}
.newtask::before{content:'+';font:400 14px var(--sans);color:var(--ac2)}
.newtask:hover{border-color:var(--ac);background:var(--surf2)}
.railscroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;padding:0 8px}
.railsec{font:600 9.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--tx4);padding:12px 6px 6px}
#rail .agent{gap:9px;padding:7px 9px;border-radius:7px}
#rail .agent.on{background:var(--sel);border-color:transparent}
#rail .agent.on::before{background:var(--ac);top:7px;bottom:7px}
#rail .agent .av{width:8px;height:8px;border-radius:50%;background:var(--pc,var(--tx4));font-size:0;display:block}
#rail .agent .nm b{font:500 12.5px var(--sans)}
#rail .agent .nm span{font:10px var(--sans);color:var(--tx4)}
#rail .agent .bdg{background:transparent;border:1px solid rgba(255,179,64,.45);color:var(--warn);min-width:16px;height:16px}
.raillib{display:flex;flex-direction:column;gap:2px}
.rlib{text-align:start;padding:7px 9px;border-radius:7px;color:var(--tx2);font:500 12.5px var(--sans);display:flex;align-items:center;gap:8px;width:100%}
.rlib:hover{background:var(--surf);color:var(--tx)}
.rlib .n{margin-left:auto;font:10px var(--mono);color:var(--tx4)}
.railfoot{border-top:1px solid var(--line);padding:6px 8px;gap:2px;display:flex;flex-direction:column}
/* Narrow windows: the conversation is the whole right-hand side, so the rail can KEEP its names
   instead of collapsing to a column of unlabelled dots. (The old rule collapsed it to 62px for the
   editor's sake, which is right in the editor and wrong here — an icon rail with no labels is an
   icon rail nobody can read.) */
@media(max-width:900px){
  body[data-ui="chat"] main{--railw:220px;grid-template-columns:var(--railw) minmax(0,1fr) 0px}
  body[data-ui="chat"] #rail .agent .nm{display:block}
  body[data-ui="chat"] .railsec,body[data-ui="chat"] .rlib,body[data-ui="chat"] .railfoot .b{display:flex}
}
@media(max-width:620px){
  body[data-ui="chat"] main{--railw:0px;grid-template-columns:0 minmax(0,1fr) 0px}
  body[data-ui="chat"] #rail{display:none}
}

/* ---- composer ---- */
.crow{display:none}
.cin{align-items:flex-end;gap:8px}
.plus{width:34px;height:34px;flex:0 0 auto;border-radius:9px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2);font-size:16px;line-height:1;display:grid;place-items:center;margin-bottom:5px}
.plus:hover{border-color:var(--ac);color:var(--tx)}
.cmenu{position:absolute;bottom:calc(100% + 6px);left:10px;z-index:70;min-width:236px;background:var(--bg3);border:1px solid var(--line3);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:none}
.cmenu.on{display:block}
.cmenu button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:start;padding:7px 10px;border-radius:7px;color:var(--tx2);font:500 12.5px var(--sans)}
.cmenu button:hover{background:var(--surf2);color:var(--tx)}
.cmenu button span{font:10.5px var(--sans);color:var(--tx4)}
.composer{position:relative}
body[data-ui="chat"] .composer{padding:6px 24px 16px}

/* ---- artifacts: the object the owner actually judges ---- */
.art{border:1px solid var(--line);border-radius:10px;background:var(--surf);cursor:default;margin-top:10px}
.art:hover{border-color:var(--line3);box-shadow:none}
.art.focused{border-color:var(--ac);box-shadow:none}
.ahd{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line);position:relative}
.atitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.atitle b{font:600 13px var(--sans);color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.atitle .asub{font:10.5px var(--sans);color:var(--tx4)}
.apill{font:600 9.5px var(--sans);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:20px;border:1px solid var(--line2);color:var(--tx3);white-space:nowrap}
.apill.review{color:var(--warn);border-color:rgba(255,179,64,.45)}
.apill.approved{color:var(--ok);border-color:rgba(46,224,138,.45)}
.apill.changes{color:var(--info);border-color:rgba(76,201,240,.45)}
.apill.failed{color:var(--err);border-color:rgba(255,84,112,.45)}
.dots{padding:3px 7px;border-radius:6px;border:1px solid transparent;color:var(--tx4);font-size:12px;line-height:1}
.dots:hover{background:var(--surf3);color:var(--tx)}
.amedia{background:#000;display:flex;align-items:center;justify-content:center}
/* Reserve the real frame before metadata arrives.  Without this, a vertical render starts as the
   browser's 300×150 placeholder, so its controls appear to be missing and the artifact feels
   broken while the first bytes are loading. */
.amedia.media-video{width:min(100%,calc(min(46vh,480px) * var(--art-ratio,.5625)));aspect-ratio:var(--art-ratio,.5625);margin:0 auto;background:#000}
.amedia.media-video video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.amedia audio{width:100%}
.amedia img{max-width:100%;display:block}
.amedia.unavailable{min-height:184px;padding:24px;background:var(--bg2);color:var(--tx3);text-align:center}
.amedia.unavailable b{display:block;margin-bottom:4px;color:var(--tx2);font:600 12.5px var(--sans)}
.amedia.unavailable span{display:block;font:11.5px/1.55 var(--sans);max-width:310px}
.ascript{padding:12px 14px;max-height:340px;overflow-y:auto;font:13px/1.7 var(--sans);color:var(--tx);white-space:pre-wrap}
.atitle-sug{padding:8px 14px;font:500 11.5px var(--sans);color:var(--tx2);border-top:1px solid var(--line);background:var(--surf)}
.atitle-k{display:inline-block;margin-inline-end:8px;padding:2px 7px;border-radius:5px;background:var(--surf2,rgba(255,255,255,.06));color:var(--tx2);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10px;direction:ltr}
.asum{padding:8px 11px;font:11.5px/1.5 var(--sans);color:var(--tx3);border-top:1px solid var(--line)}
.aprim{display:flex;gap:6px;padding:9px 11px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.aprim button{font:500 11.5px var(--sans);padding:6px 12px;border-radius:7px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx2)}
.aprim button:hover{border-color:var(--line3);color:var(--tx)}
.aprim button.pa{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.aprim button.pa:hover{background:var(--ac2)}
.aprim button.ok{background:var(--ok);border-color:transparent;color:#04120b;font-weight:600}
.aprim .grow{flex:1}
.artmenu{position:absolute;top:36px;right:9px;z-index:60;min-width:210px;background:var(--bg3);border:1px solid var(--line3);border-radius:9px;box-shadow:var(--shadow);padding:4px;display:none}
.artmenu.on{display:block}
.artmenu button,.artmenu a{display:block;width:100%;text-align:start;padding:6px 9px;border-radius:6px;color:var(--tx2);font:12px var(--sans);text-decoration:none;cursor:pointer}
.artmenu button:hover,.artmenu a:hover{background:var(--surf2);color:var(--tx)}
.artmenu .sep{height:1px;background:var(--line);margin:4px 5px}
.artmenu .tech{font:10px var(--mono);color:var(--tx4);padding:6px 9px;word-break:break-all;line-height:1.5;border-top:1px solid var(--line);margin-top:4px}
.art.missing{border-color:rgba(255,84,112,.4)}

/* artifact set — many versions from one request, presented as a set instead of seven messages */
.artset{margin-top:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg3);overflow:hidden}
.asethd{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:1px solid var(--line)}
.asethd b{font:600 13px var(--sans);color:var(--tx)}
.asethd .asub{font:10.5px var(--sans);color:var(--tx4)}
.asethd .grow{flex:1}
.asetacts{display:flex;gap:6px;padding:8px 11px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.asetacts button{font:500 11.5px var(--sans);padding:6px 11px;border-radius:7px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx2)}
.asetacts button:hover{border-color:var(--line3);color:var(--tx)}
.asetacts button.pa{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.asetacts .sel{font:10.5px var(--mono);color:var(--tx4)}
.asetgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(198px,1fr));gap:1px;background:var(--line)}
.artv{background:var(--surf);display:flex;flex-direction:column;cursor:pointer}
.artv.on{background:var(--surf2);box-shadow:inset 0 0 0 1px var(--ac)}
.artv .vth{background:#000;height:186px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.artv .vth video{max-height:186px;max-width:100%;display:block}
.artv.unavailable .vth{padding:14px;background:var(--bg2);color:var(--tx3);font:11px/1.5 var(--sans);text-align:center}
.artv.unavailable .vth b{display:block;color:var(--tx2);margin-bottom:3px}
.artv .vm{padding:8px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.artv .vm b{font:600 12px var(--sans);color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artv .vm span{font:10.5px var(--sans);color:var(--tx4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.artv .vw{display:flex;gap:5px;padding:0 10px 9px;flex-wrap:wrap}
.artv .vw button{font:500 10.5px var(--sans);padding:4px 8px;border-radius:6px;border:1px solid var(--line2);background:var(--surf);color:var(--tx2)}
.artv .vw button:hover{border-color:var(--ac);color:var(--tx)}

/* ---- source candidates: compact, judgeable, no wall of technical metadata ---- */
/* A candidate is a video you have to judge before you spend a download on it. It gets the width
   (one per row, never side by side), a definite-height frame so the preview cannot collapse, and a
   preview that is the real stream at contain-fit — a 9:16 clip cropped to a 16:9 box is not
   judgeable. Metadata that only the ranking cares about lives under Details. */
.cand{display:block;border:1px solid var(--line);border-radius:12px;background:var(--surf);overflow:hidden}
.cand:hover{border-color:var(--line3);transform:none;box-shadow:none}
.cand .cth{height:clamp(210px,42vh,400px);background:#07070a;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cand .cth .ph{position:absolute;inset:0;background:#07070a center/contain no-repeat;z-index:0}
.cand .cth video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#07070a;z-index:1;display:block}
.cand .cth .du{position:absolute;right:9px;bottom:9px;z-index:2;padding:3px 7px;border-radius:5px;background:rgba(8,8,10,.8);font:11px var(--mono);color:#fff}
.cand .cinf{padding:12px 15px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cand .cinf b{font:600 14.5px/1.35 var(--sans);color:var(--tx);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cand .cln{font:12px var(--sans);color:var(--tx4)}
.cand .cln i{font-style:normal;padding:0 5px;color:var(--line3)}
.cand .csig{font:12px/1.5 var(--sans);color:var(--tx3)}
.cand .csig i{font-style:normal;padding:0 5px;color:var(--line3)}
.cand .csig .yes{color:var(--ok)}
.cand .csig .no{color:var(--err)}
.cand .csig .unk{color:var(--tx4)}
.cand .cact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:2px}
.cand .cact button{font:500 12.5px var(--sans);padding:7px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--surf2);color:var(--tx2)}
.cand .cact button:hover{border-color:var(--line3);color:var(--tx)}
.cand .cact button.imp{border-color:var(--ac);color:var(--tx)}
.cand .cact button.imp:hover{background:var(--acsoft)}
.cand .cact button[disabled]{opacity:.5}
.cand .cst{font:12px var(--sans);color:var(--tx3);min-height:15px}
.cand .cst.err{color:var(--err)}
.cand .cdet{margin-left:auto}
.cand .cdet summary{font:12px var(--sans);color:var(--tx4);cursor:pointer;list-style:none}
.cand .cdet summary::-webkit-details-marker{display:none}
.cand .cdet summary:hover{color:var(--tx2)}
.cand .cdet div{font:11px/1.75 var(--mono);color:var(--tx4);padding-top:7px;white-space:pre-wrap}
.cand.imported{border-color:rgba(46,224,138,.45)}
.cand.importing{opacity:.75}
.candlist{display:flex;flex-direction:column;gap:18px;padding:8px 0 2px}
.candlist .cand{width:100%}
.shead .sheadh{font:600 15px var(--sans);color:var(--tx);letter-spacing:-.01em}
.shead details.cdet summary{font:12px var(--sans);color:var(--tx4);cursor:pointer;list-style:none}
.shead details.cdet summary::-webkit-details-marker{display:none}
.shead details.cdet summary:hover{color:var(--tx2)}
.shead details.cdet div{font:11px/1.75 var(--mono);color:var(--tx4);padding-top:6px;white-space:pre-wrap}
.candrow .cand{flex:0 0 210px}
.candrow .cand .cth{height:150px}

/* ---- the saved-source library ---- */
#chat{position:relative}
.libpanel{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;min-height:0}
.libhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.libhead b{font:600 14.5px var(--sans);color:var(--tx)}
.libhead .sub{font:12px/1.4 var(--sans);color:var(--tx4)}
.libscroll{padding:16px;overflow-y:auto;min-height:0;flex:1;display:flex;flex-direction:column;gap:18px}
.libscroll .cand{width:100%;display:grid;grid-template-columns:150px minmax(0,1fr)}
.libscroll .cand .cth{height:150px;min-height:150px}
.libscroll .cand .cth.empty{color:var(--tx4);font:600 12px var(--sans);letter-spacing:.02em;background:var(--surf2)}
.libscroll .empty{margin:auto;max-width:520px;text-align:left}
.raillib .n{font:11px var(--mono);color:var(--tx4);margin-left:auto}

/* ---- empty state ---- */
.home{max-width:600px;margin:5vh auto 0}
.home h2{font:600 21px var(--sans);letter-spacing:-.02em;margin-bottom:7px}
.hgrid{grid-template-columns:1fr 1fr;margin-top:18px}

</style>
